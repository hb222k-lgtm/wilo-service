<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="찬양·방송">
<title>찬양팀 · 방송실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f2f7;--card:#fff;--primary:#5856d6;--danger:#ff3b30;--success:#34c759;
  --warn:#ff9500;--text:#1c1c1e;--sub:#8e8e93;--border:#e5e5ea;
  --nav-h:83px;--top-safe:env(safe-area-inset-top);--bot-safe:env(safe-area-inset-bottom);
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,sans-serif;color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--nav-h)}
.page{display:none;padding:0 0 16px}
.page.active{display:block}

/* Top bar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top-safe) + 8px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:22px;font-weight:700}
.topbar .btn-icon{width:36px;height:36px;border:none;background:var(--primary);color:#fff;border-radius:50%;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--bot-safe)}
.nav-btn{flex:1;border:none;background:none;padding:8px 0;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;transition:color .15s;position:relative}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{width:24px;height:24px}
.nav-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:none;
  align-items:center;justify-content:center;padding:0 4px}
.nav-badge.show{display:flex}

/* Cards */
.card{background:var(--card);border-radius:12px;margin:8px 16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:space-between}
.card-row{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:12px;cursor:pointer}
.card-row:last-child{border-bottom:none}
.card-row:active{background:var(--bg)}
.card-row .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.card-row .info{flex:1;min-width:0}
.card-row .info .title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .info .sub{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{color:var(--sub);font-size:12px}

.section-label{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;
  padding:16px 16px 4px;letter-spacing:.5px}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#e3f9e5;color:#1d8a35}
.badge-orange{background:#fff3e0;color:#c05800}

/* Search bar */
.search-wrap{padding:8px 16px 0}
.search-box{display:flex;align-items:center;background:var(--card);border-radius:10px;
  padding:8px 12px;gap:8px;border:1px solid var(--border)}
.search-box input{border:none;outline:none;width:100%;font-size:15px;background:none}

/* Folder chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}

/* Song grid */
.song-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px 16px}
.song-card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.song-card:active{opacity:.7}
.song-card .thumb{aspect-ratio:3/4;background:#e9e9ee;display:flex;align-items:center;
  justify-content:center;font-size:34px;overflow:hidden}
.song-card .thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.song-card .meta{padding:9px 11px}
.song-card .meta .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-card .meta .s{font-size:12px;color:var(--sub);margin-top:2px}

/* Quick request buttons */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px}
.quick-btn{border:none;background:var(--card);border-radius:14px;padding:16px 10px;font-size:14px;
  font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--text);
  display:flex;flex-direction:column;align-items:center;gap:7px;font-family:inherit}
.quick-btn:active{background:var(--bg)}
.quick-btn .emoji{font-size:26px}

/* Request rows */
.req-row{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.req-row:last-child{border-bottom:none}
.req-row.pending{background:#fffaf2}
.req-row .msg{flex:1;min-width:0}
.req-row .msg .m{font-size:15px;font-weight:500;word-break:break-all}
.req-row .msg .s{font-size:12px;color:var(--sub);margin-top:3px}
.req-done-btn{border:none;background:var(--success);color:#fff;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit}
.req-del-btn{border:none;background:none;color:var(--sub);font-size:16px;cursor:pointer;flex-shrink:0;padding:4px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--bot-safe) + 16px)}
.modal-header{padding:16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{border:none;background:none;font-size:24px;color:var(--sub);cursor:pointer;padding:4px}
.modal-body{padding:16px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:15px;outline:none;background:#fff;font-family:inherit;color:var(--text)}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:80px}

.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;
  font-weight:600;cursor:pointer;text-align:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.8}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:14px;border-radius:8px;display:inline-block;width:auto}
.btn-row{display:flex;gap:10px;margin-top:8px}
.btn-row .btn{flex:1}

/* Setlist detail rows */
.sl-song{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.sl-song:last-child{border-bottom:none}
.sl-song .num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sl-song .t{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-song .ctl{display:flex;gap:2px;flex-shrink:0}
.sl-song .ctl button{border:none;background:var(--bg);color:var(--text);width:30px;height:30px;
  border-radius:8px;font-size:14px;cursor:pointer}
.sl-song .ctl button.rm{color:var(--danger)}

/* Fullscreen sheet viewer */
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:900;flex-direction:column}
#viewer.open{display:flex}
#viewerBar{padding:calc(var(--top-safe) + 10px) 16px 10px;display:flex;align-items:center;
  justify-content:space-between;background:rgba(0,0,0,.8);color:#fff;gap:10px}
#viewerBar .vt{font-size:16px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewerBar button{border:none;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;
  padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;font-family:inherit}
#viewerBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--bot-safe)}
#viewerBody .song-title{color:#fff;font-size:17px;font-weight:700;padding:18px 16px 8px;
  display:flex;align-items:center;gap:8px}
#viewerBody .song-title .n{width:24px;height:24px;border-radius:50%;background:var(--primary);
  font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#viewerBody img{display:block;width:100%;margin-bottom:4px}
#viewerBody .page-wrap{position:relative}
#viewerBody .page-del{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;
  color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer}

.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:14px}
.empty .big{font-size:40px;margin-bottom:10px}

#toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.92);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:1000;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#fileInput,#pageAddInput{display:none}
</style>
</head>
<body>
<div id="app">
<div id="content">

  <!-- 악보 -->
  <div class="page active" id="page-songs">
    <div class="topbar">
      <h1>악보</h1>
      <button class="btn-icon" onclick="openSongModal()">+</button>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input id="songSearch" placeholder="곡 제목 검색" oninput="renderSongs()">
      </div>
    </div>
    <div class="chips" id="folderChips"></div>
    <div id="songList"></div>
  </div>

  <!-- 콘티 -->
  <div class="page" id="page-setlists">
    <div class="topbar">
      <h1>콘티</h1>
      <button class="btn-icon" onclick="openSetlistModal()">+</button>
    </div>
    <div id="setlistList"></div>
  </div>

  <!-- 방송실 요청 -->
  <div class="page" id="page-requests">
    <div class="topbar">
      <h1>방송실 요청</h1>
      <button class="btn-icon" onclick="openCustomRequest()">+</button>
    </div>
    <div class="section-label">빠른 요청 (누르면 바로 전송)</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="sendQuick('모니터 소리 키워주세요')"><span class="emoji">🔊</span>모니터 소리<br>키워주세요</button>
      <button class="quick-btn" onclick="sendQuick('모니터 소리 줄여주세요')"><span class="emoji">🔉</span>모니터 소리<br>줄여주세요</button>
      <button class="quick-btn" onclick="sendQuick('마이크가 안 들려요')"><span class="emoji">🎤</span>마이크가<br>안 들려요</button>
      <button class="quick-btn" onclick="sendQuick('하울링(삐- 소리)이 나요')"><span class="emoji">⚠️</span>하울링이<br>나요</button>
    </div>
    <div class="section-label">요청 내역</div>
    <div class="card" id="requestList"></div>
  </div>

  <!-- 메모 -->
  <div class="page" id="page-notes">
    <div class="topbar">
      <h1>전달사항</h1>
      <button class="btn-icon" onclick="openNoteModal()">+</button>
    </div>
    <div id="noteList"></div>
  </div>

</div>

<!-- Bottom nav -->
<div id="nav">
  <button class="nav-btn active" data-page="songs" onclick="switchTab('songs')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zm12-3c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2z"/></svg>
    악보
  </button>
  <button class="nav-btn" data-page="setlists" onclick="switchTab('setlists')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h10M4 18h10"/></svg>
    콘티
  </button>
  <button class="nav-btn" data-page="requests" onclick="switchTab('requests')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.42-4.03 8-9 8a9.86 9.86 0 01-4.26-.95L3 20l1.3-3.9A7.9 7.9 0 013 12c0-4.42 4.03-8 9-8s9 3.58 9 8z"/></svg>
    요청
    <span class="nav-badge" id="reqBadge"></span>
  </button>
  <button class="nav-btn" data-page="notes" onclick="switchTab('notes')">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.4-9.4a2 2 0 112.8 2.8L11 15l-4 1 1-4 9.6-9.4z"/></svg>
    전달사항
  </button>
</div>
</div>

<!-- 악보 추가 모달 -->
<div class="modal-bg" id="songModal">
  <div class="modal">
    <div class="modal-header"><h2>악보 추가</h2><button class="modal-close" onclick="closeModal('songModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>곡 제목 *</label><input id="songTitle" placeholder="예) 주 은혜임을"></div>
      <div class="form-group"><label>폴더</label><input id="songFolder" list="folderOptions" placeholder="예) 주일예배, 기도회 (미입력 시 기본)"><datalist id="folderOptions"></datalist></div>
      <div class="form-group"><label>메모</label><input id="songMemo" placeholder="키, 특이사항 등 (선택)"></div>
      <div class="form-group">
        <label>악보 사진 (여러 장 선택 가능)</label>
        <button class="btn btn-outline" onclick="document.getElementById('fileInput').click()" id="fileBtn">📷 사진 선택</button>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="updateFileBtn()">
      </div>
      <button class="btn btn-primary" onclick="saveSong()">저장</button>
    </div>
  </div>
</div>

<!-- 콘티 추가/수정 모달 -->
<div class="modal-bg" id="setlistModal">
  <div class="modal">
    <div class="modal-header"><h2 id="setlistModalTitle">콘티 추가</h2><button class="modal-close" onclick="closeModal('setlistModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>제목 *</label><input id="slTitle" placeholder="예) 7/27 주일예배, 금요기도회"></div>
      <div class="form-group"><label>날짜</label><input id="slDate" type="date"></div>
      <div class="form-group"><label>메모</label><textarea id="slMemo" placeholder="전달사항 등 (선택)"></textarea></div>
      <button class="btn btn-primary" onclick="saveSetlist()">저장</button>
    </div>
  </div>
</div>

<!-- 콘티 상세 모달 -->
<div class="modal-bg" id="setlistDetail">
  <div class="modal">
    <div class="modal-header"><h2 id="sdTitle"></h2><button class="modal-close" onclick="closeModal('setlistDetail')">✕</button></div>
    <div class="modal-body">
      <div id="sdMeta" style="font-size:13px;color:var(--sub);margin-bottom:10px"></div>
      <div id="sdSongs"></div>
      <div class="btn-row">
        <button class="btn btn-outline btn-sm" onclick="openSongPicker()" style="width:100%">＋ 곡 추가</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="playSetlist()">🎵 악보 보기 (연주 모드)</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="editSetlist()">수정</button>
        <button class="btn btn-danger" onclick="deleteSetlist()">삭제</button>
      </div>
    </div>
  </div>
</div>

<!-- 곡 선택 모달 (콘티에 추가) -->
<div class="modal-bg" id="songPicker">
  <div class="modal">
    <div class="modal-header"><h2>곡 선택</h2><button class="modal-close" onclick="closeModal('songPicker')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><input id="pickerSearch" placeholder="곡 제목 검색" oninput="renderPicker()"></div>
      <div id="pickerList"></div>
    </div>
  </div>
</div>

<!-- 직접 요청 모달 -->
<div class="modal-bg" id="customRequest">
  <div class="modal">
    <div class="modal-header"><h2>직접 요청 보내기</h2><button class="modal-close" onclick="closeModal('customRequest')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>보내는 사람</label><input id="reqSender" placeholder="이름 (한 번 입력하면 저장돼요)"></div>
      <div class="form-group"><label>요청 내용 *</label><textarea id="reqMessage" placeholder="예) 2번 마이크 볼륨 조금만 올려주세요"></textarea></div>
      <button class="btn btn-primary" onclick="sendCustomRequest()">전송</button>
    </div>
  </div>
</div>

<!-- 메모 모달 -->
<div class="modal-bg" id="noteModal">
  <div class="modal">
    <div class="modal-header"><h2 id="noteModalTitle">전달사항 추가</h2><button class="modal-close" onclick="closeModal('noteModal')">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>제목 *</label><input id="noteTitle" placeholder="예) 주일 리허설 시간 변경"></div>
      <div class="form-group"><label>내용</label><textarea id="noteContent" style="min-height:140px"></textarea></div>
      <button class="btn btn-primary" onclick="saveNote()">저장</button>
      <div class="btn-row" id="noteDeleteRow" style="display:none">
        <button class="btn btn-danger" onclick="deleteNote()">삭제</button>
      </div>
    </div>
  </div>
</div>

<!-- 악보 뷰어 -->
<div id="viewer">
  <div id="viewerBar">
    <div class="vt" id="viewerTitle"></div>
    <button id="viewerAddBtn" onclick="document.getElementById('pageAddInput').click()">＋ 페이지</button>
    <button id="viewerDelBtn" onclick="deleteCurrentSong()">삭제</button>
    <button onclick="closeViewer()">닫기</button>
  </div>
  <div id="viewerBody"></div>
</div>
<input type="file" id="pageAddInput" accept="image/*" multiple onchange="addPagesToSong()">

<div id="toast"></div>

<script>
const api = {
  async get(u){ const r = await fetch(u); return r.json(); },
  async post(u, body){
    const r = await fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    return r.json();
  },
  async postForm(u, form){ const r = await fetch(u, {method:'POST', body:form}); return r.json(); },
  async put(u, body){
    const r = await fetch(u, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    return r.json();
  },
  async del(u){ const r = await fetch(u, {method:'DELETE'}); return r.json(); },
};

let songs = [], folders = [], setlists = [], requests = [], notes = [];
let currentFolder = '';
let currentSetlist = null;   // 콘티 상세
let viewerSongId = null;     // 뷰어에 열린 단일 곡
let lastReqIds = null;       // 새 요청 감지용

const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

function switchTab(name){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  document.getElementById('content').scrollTop = 0;
  if (name === 'songs') loadSongs();
  if (name === 'setlists') loadSetlists();
  if (name === 'requests') loadRequests();
  if (name === 'notes') loadNotes();
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-bg').forEach(m =>
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

// DB 시각(UTC 기준)을 "n분 전" 형태로
function timeAgo(ts){
  if (!ts) return '';
  const d = new Date(ts.replace(' ', 'T') + (ts.includes('Z') || ts.includes('+') ? '' : 'Z'));
  const diff = (Date.now() - d.getTime()) / 1000;
  if (isNaN(diff)) return ts;
  if (diff < 60) return '방금 전';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  return d.toLocaleDateString('ko-KR', {month:'numeric', day:'numeric'}) + ' ' +
         d.toLocaleTimeString('ko-KR', {hour:'numeric', minute:'2-digit'});
}

// ── 악보 ──────────────────────────────────────────────

async function loadSongs(){
  [songs, folders] = await Promise.all([api.get('/api/band/songs'), api.get('/api/band/folders')]);
  renderFolders();
  renderSongs();
}

function renderFolders(){
  const el = document.getElementById('folderChips');
  let html = `<button class="chip ${currentFolder===''?'active':''}" onclick="setFolder('')">전체</button>`;
  for (const f of folders)
    html += `<button class="chip ${currentFolder===f.folder?'active':''}" onclick="setFolder('${esc(f.folder).replace(/'/g,"\\'")}')">${esc(f.folder)} ${f.cnt}</button>`;
  el.innerHTML = html;
  document.getElementById('folderOptions').innerHTML =
    folders.map(f => `<option value="${esc(f.folder)}">`).join('');
}

function setFolder(f){ currentFolder = f; renderFolders(); renderSongs(); }

function renderSongs(){
  const q = document.getElementById('songSearch').value.trim().toLowerCase();
  const list = songs.filter(s =>
    (!currentFolder || (s.folder || '기본') === currentFolder) &&
    (!q || s.title.toLowerCase().includes(q)));
  const el = document.getElementById('songList');
  if (!list.length){
    el.innerHTML = `<div class="empty"><div class="big">🎼</div>아직 악보가 없어요.<br>오른쪽 위 + 버튼으로 캡쳐한 악보를 올려보세요.</div>`;
    return;
  }
  el.innerHTML = `<div class="song-grid">` + list.map(s => `
    <div class="song-card" onclick="openSongViewer('${s.id}')">
      <div class="thumb">${s.cover
        ? `<img src="/api/thumb/band_${s.id}/${s.cover}" loading="lazy">`
        : '🎼'}</div>
      <div class="meta">
        <div class="t">${esc(s.title)}</div>
        <div class="s">${esc(s.folder || '기본')} · ${s.page_count}장</div>
      </div>
    </div>`).join('') + `</div>`;
}

function openSongModal(){
  ['songTitle','songFolder','songMemo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('songFolder').value = currentFolder;
  document.getElementById('fileInput').value = '';
  updateFileBtn();
  openModal('songModal');
}

function updateFileBtn(){
  const n = document.getElementById('fileInput').files.length;
  document.getElementById('fileBtn').textContent = n ? `📷 ${n}장 선택됨` : '📷 사진 선택';
}

async function saveSong(){
  const title = document.getElementById('songTitle').value.trim();
  if (!title) return toast('곡 제목을 입력하세요');
  const form = new FormData();
  form.append('title', title);
  form.append('folder', document.getElementById('songFolder').value.trim());
  form.append('memo', document.getElementById('songMemo').value.trim());
  for (const f of document.getElementById('fileInput').files) form.append('pages', f);
  toast('업로드 중...');
  const res = await api.postForm('/api/band/songs', form);
  if (res.error) return toast(res.error);
  closeModal('songModal');
  toast('악보를 추가했어요');
  loadSongs();
}

// ── 악보 뷰어 ──────────────────────────────────────────

async function openSongViewer(songId){
  const s = await api.get('/api/band/songs/' + songId);
  viewerSongId = songId;
  document.getElementById('viewerTitle').textContent = s.title + (s.memo ? ' · ' + s.memo : '');
  document.getElementById('viewerAddBtn').style.display = '';
  document.getElementById('viewerDelBtn').style.display = '';
  const body = document.getElementById('viewerBody');
  body.innerHTML = s.pages.length
    ? s.pages.map(p => `
        <div class="page-wrap">
          <img src="/api/photo/band_${songId}/${p.filename}" loading="lazy">
          <button class="page-del" onclick="deletePage('${p.id}')">✕</button>
        </div>`).join('')
    : `<div class="empty" style="color:#aaa"><div class="big">📄</div>아직 페이지가 없어요.<br>위 [＋ 페이지] 버튼으로 사진을 추가하세요.</div>`;
  document.getElementById('viewer').classList.add('open');
  body.scrollTop = 0;
}

function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
  viewerSongId = null;
}

async function addPagesToSong(){
  if (!viewerSongId) return;
  const files = document.getElementById('pageAddInput').files;
  if (!files.length) return;
  const form = new FormData();
  for (const f of files) form.append('pages', f);
  toast('업로드 중...');
  await api.postForm(`/api/band/songs/${viewerSongId}/pages`, form);
  document.getElementById('pageAddInput').value = '';
  toast('페이지를 추가했어요');
  openSongViewer(viewerSongId);
  loadSongs();
}

async function deletePage(pid){
  if (!confirm('이 페이지를 삭제할까요?')) return;
  await api.del('/api/band/pages/' + pid);
  openSongViewer(viewerSongId);
  loadSongs();
}

async function deleteCurrentSong(){
  if (!viewerSongId) return;
  if (!confirm('이 곡과 악보를 모두 삭제할까요?\n콘티에 들어있는 경우 콘티에서도 빠집니다.')) return;
  await api.del('/api/band/songs/' + viewerSongId);
  closeViewer();
  toast('삭제했어요');
  loadSongs();
}

// ── 콘티 ──────────────────────────────────────────────

async function loadSetlists(){
  setlists = await api.get('/api/band/setlists');
  const el = document.getElementById('setlistList');
  if (!setlists.length){
    el.innerHTML = `<div class="empty"><div class="big">📋</div>아직 콘티가 없어요.<br>예배·기도회 콘티를 만들어보세요.</div>`;
    return;
  }
  el.innerHTML = `<div class="card">` + setlists.map(sl => `
    <div class="card-row" onclick="openSetlistDetail('${sl.id}')">
      <div class="icon" style="background:#efeeff">📋</div>
      <div class="info">
        <div class="title">${esc(sl.title)}</div>
        <div class="sub">${sl.setlist_date ? esc(sl.setlist_date) + ' · ' : ''}${sl.song_count}곡</div>
      </div>
      <span class="chevron">›</span>
    </div>`).join('') + `</div>`;
}

let editingSetlistId = null;

function openSetlistModal(edit){
  editingSetlistId = edit ? currentSetlist.id : null;
  document.getElementById('setlistModalTitle').textContent = edit ? '콘티 수정' : '콘티 추가';
  document.getElementById('slTitle').value = edit ? currentSetlist.title : '';
  document.getElementById('slDate').value = edit ? (currentSetlist.setlist_date || '') : '';
  document.getElementById('slMemo').value = edit ? (currentSetlist.memo || '') : '';
  openModal('setlistModal');
}

async function saveSetlist(){
  const title = document.getElementById('slTitle').value.trim();
  if (!title) return toast('제목을 입력하세요');
  const body = {
    title,
    setlist_date: document.getElementById('slDate').value || null,
    memo: document.getElementById('slMemo').value.trim(),
  };
  if (editingSetlistId){
    await api.put('/api/band/setlists/' + editingSetlistId, body);
    closeModal('setlistModal');
    openSetlistDetail(editingSetlistId);
  } else {
    const res = await api.post('/api/band/setlists', body);
    if (res.error) return toast(res.error);
    closeModal('setlistModal');
    openSetlistDetail(res.id);
  }
  loadSetlists();
}

async function openSetlistDetail(slid){
  currentSetlist = await api.get('/api/band/setlists/' + slid);
  document.getElementById('sdTitle').textContent = currentSetlist.title;
  document.getElementById('sdMeta').textContent =
    [currentSetlist.setlist_date, currentSetlist.memo].filter(Boolean).join(' · ');
  renderSetlistSongs();
  openModal('setlistDetail');
}

function renderSetlistSongs(){
  const el = document.getElementById('sdSongs');
  const list = currentSetlist.songs;
  if (!list.length){
    el.innerHTML = `<div class="empty" style="padding:20px">아직 곡이 없어요. 아래에서 곡을 추가하세요.</div>`;
    return;
  }
  el.innerHTML = list.map((s, i) => `
    <div class="sl-song">
      <div class="num">${i+1}</div>
      <div class="t" onclick="openSongViewer('${s.song_id}')">${esc(s.title)}<span style="color:var(--sub);font-size:12px"> · ${s.page_count}장</span></div>
      <div class="ctl">
        <button onclick="moveSong(${i},-1)" ${i===0?'disabled':''}>▲</button>
        <button onclick="moveSong(${i},1)" ${i===list.length-1?'disabled':''}>▼</button>
        <button class="rm" onclick="removeFromSetlist('${s.item_id}')">✕</button>
      </div>
    </div>`).join('');
}

async function moveSong(i, dir){
  const list = currentSetlist.songs;
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  renderSetlistSongs();
  await api.put(`/api/band/setlists/${currentSetlist.id}/order`, {item_ids: list.map(s => s.item_id)});
}

async function removeFromSetlist(itemId){
  await api.del(`/api/band/setlists/${currentSetlist.id}/songs/${itemId}`);
  currentSetlist = await api.get('/api/band/setlists/' + currentSetlist.id);
  renderSetlistSongs();
  loadSetlists();
}

function editSetlist(){ openSetlistModal(true); }

async function deleteSetlist(){
  if (!confirm('이 콘티를 삭제할까요? (악보는 지워지지 않아요)')) return;
  await api.del('/api/band/setlists/' + currentSetlist.id);
  closeModal('setlistDetail');
  toast('삭제했어요');
  loadSetlists();
}

// 콘티에 곡 추가
async function openSongPicker(){
  songs = await api.get('/api/band/songs');
  document.getElementById('pickerSearch').value = '';
  renderPicker();
  openModal('songPicker');
}

function renderPicker(){
  const q = document.getElementById('pickerSearch').value.trim().toLowerCase();
  const inSetlist = new Set(currentSetlist.songs.map(s => s.song_id));
  const list = songs.filter(s => !q || s.title.toLowerCase().includes(q));
  document.getElementById('pickerList').innerHTML = list.length ? list.map(s => `
    <div class="sl-song" onclick="pickSong('${s.id}')" style="cursor:pointer">
      <div class="t">${esc(s.title)}<span style="color:var(--sub);font-size:12px"> · ${esc(s.folder||'기본')} · ${s.page_count}장</span></div>
      ${inSetlist.has(s.id) ? '<span class="badge badge-green">추가됨</span>' : '<span style="color:var(--primary);font-weight:700">＋</span>'}
    </div>`).join('')
    : `<div class="empty" style="padding:20px">곡이 없어요. 악보 탭에서 먼저 추가하세요.</div>`;
}

async function pickSong(songId){
  await api.post(`/api/band/setlists/${currentSetlist.id}/songs`, {song_id: songId});
  currentSetlist = await api.get('/api/band/setlists/' + currentSetlist.id);
  renderPicker();
  renderSetlistSongs();
  loadSetlists();
}

// 연주 모드: 콘티 전체 악보를 순서대로
async function playSetlist(){
  const sl = await api.get('/api/band/setlists/' + currentSetlist.id);
  if (!sl.songs.length) return toast('콘티에 곡을 먼저 추가하세요');
  const details = await Promise.all(sl.songs.map(s => api.get('/api/band/songs/' + s.song_id)));
  viewerSongId = null;
  document.getElementById('viewerTitle').textContent = sl.title;
  document.getElementById('viewerAddBtn').style.display = 'none';
  document.getElementById('viewerDelBtn').style.display = 'none';
  document.getElementById('viewerBody').innerHTML = details.map((s, i) => `
    <div class="song-title"><span class="n">${i+1}</span>${esc(s.title)}${s.memo ? ` <span style="font-weight:400;color:#bbb;font-size:13px">${esc(s.memo)}</span>` : ''}</div>
    ${s.pages.map(p => `<img src="/api/photo/band_${s.id}/${p.filename}" loading="lazy">`).join('')}
  `).join('');
  document.getElementById('viewer').classList.add('open');
  document.getElementById('viewerBody').scrollTop = 0;
}

// ── 방송실 요청 ────────────────────────────────────────

function myName(){ return localStorage.getItem('band_name') || ''; }

async function loadRequests(){
  requests = await api.get('/api/band/requests');
  const pendingIds = requests.filter(r => r.status === 'pending').map(r => r.id);
  // 새 요청 도착 시 진동 (지원 기기만)
  if (lastReqIds && pendingIds.some(id => !lastReqIds.includes(id)) && navigator.vibrate)
    navigator.vibrate([200, 100, 200]);
  lastReqIds = pendingIds;

  const badge = document.getElementById('reqBadge');
  badge.textContent = pendingIds.length;
  badge.classList.toggle('show', pendingIds.length > 0);

  const el = document.getElementById('requestList');
  if (!requests.length){
    el.innerHTML = `<div class="empty" style="padding:24px">아직 요청이 없어요</div>`;
    return;
  }
  el.innerHTML = requests.map(r => `
    <div class="req-row ${r.status==='pending'?'pending':''}">
      <div class="msg">
        <div class="m">${esc(r.message)}</div>
        <div class="s">${r.sender ? esc(r.sender) + ' · ' : ''}${timeAgo(r.created_at)}
          ${r.status==='done' ? '<span class="badge badge-green">완료</span>' : '<span class="badge badge-orange">대기중</span>'}</div>
      </div>
      ${r.status==='pending'
        ? `<button class="req-done-btn" onclick="markDone('${r.id}')">✓ 완료</button>`
        : `<button class="req-del-btn" onclick="delRequest('${r.id}')">✕</button>`}
    </div>`).join('');
}

async function sendQuick(msg){
  await api.post('/api/band/requests', {sender: myName(), message: msg});
  toast('방송실에 요청을 보냈어요 📨');
  loadRequests();
}

function openCustomRequest(){
  document.getElementById('reqSender').value = myName();
  document.getElementById('reqMessage').value = '';
  openModal('customRequest');
}

async function sendCustomRequest(){
  const msg = document.getElementById('reqMessage').value.trim();
  if (!msg) return toast('요청 내용을 입력하세요');
  const sender = document.getElementById('reqSender').value.trim();
  if (sender) localStorage.setItem('band_name', sender);
  await api.post('/api/band/requests', {sender, message: msg});
  closeModal('customRequest');
  toast('방송실에 요청을 보냈어요 📨');
  loadRequests();
}

async function markDone(rid){
  await api.post(`/api/band/requests/${rid}/done`, {});
  loadRequests();
}

async function delRequest(rid){
  await api.del('/api/band/requests/' + rid);
  loadRequests();
}

// 5초마다 새 요청 확인 (화면이 보일 때만)
setInterval(() => { if (!document.hidden) loadRequests(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadRequests(); });

// ── 전달사항 메모 ──────────────────────────────────────

let editingNoteId = null;

async function loadNotes(){
  notes = await api.get('/api/band/notes');
  const el = document.getElementById('noteList');
  if (!notes.length){
    el.innerHTML = `<div class="empty"><div class="big">📝</div>주의사항, 전달사항을 남겨보세요.</div>`;
    return;
  }
  el.innerHTML = `<div class="card">` + notes.map(n => `
    <div class="card-row" onclick="openNoteModal('${n.id}')">
      <div class="icon" style="background:#fff3e0">📌</div>
      <div class="info">
        <div class="title">${esc(n.title)}</div>
        <div class="sub">${esc((n.content||'').split('\n')[0])||' '} · ${timeAgo(n.updated_at)}</div>
      </div>
      <span class="chevron">›</span>
    </div>`).join('') + `</div>`;
}

function openNoteModal(nid){
  editingNoteId = nid || null;
  const n = nid ? notes.find(x => x.id === nid) : null;
  document.getElementById('noteModalTitle').textContent = n ? '전달사항 수정' : '전달사항 추가';
  document.getElementById('noteTitle').value = n ? n.title : '';
  document.getElementById('noteContent').value = n ? (n.content || '') : '';
  document.getElementById('noteDeleteRow').style.display = n ? 'flex' : 'none';
  openModal('noteModal');
}

async function saveNote(){
  const title = document.getElementById('noteTitle').value.trim();
  if (!title) return toast('제목을 입력하세요');
  const body = {title, content: document.getElementById('noteContent').value};
  if (editingNoteId) await api.put('/api/band/notes/' + editingNoteId, body);
  else await api.post('/api/band/notes', body);
  closeModal('noteModal');
  loadNotes();
}

async function deleteNote(){
  if (!confirm('이 전달사항을 삭제할까요?')) return;
  await api.del('/api/band/notes/' + editingNoteId);
  closeModal('noteModal');
  loadNotes();
}

// ── 시작 ──────────────────────────────────────────────
loadSongs();
loadRequests();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교회 자막 컨트롤러</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--panel:#16213e;--card:#0f3460;--accent:#e94560;
  --accent2:#533483;--text:#eaeaea;--sub:#9ca3af;--border:#2d3748;
  --green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6;
  --font:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
button{cursor:pointer;font-family:var(--font)}

/* ── Layout ── */
#app{display:grid;grid-template-columns:280px 1fr 300px;grid-template-rows:56px 1fr;height:100vh}
#topbar{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:12px;z-index:10}
#sidebar{background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
#main{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#rightpanel{background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ── */
#topbar h1{font-size:18px;font-weight:700;color:#fff;white-space:nowrap}
#topbar .tag{font-size:11px;background:var(--accent2);color:#fff;padding:2px 8px;
  border-radius:20px;white-space:nowrap}
.spacer{flex:1}
.top-btn{padding:7px 14px;border:none;border-radius:8px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:6px}
.top-btn.blank{background:#374151;color:var(--text)}
.top-btn.blank:hover{background:#4b5563}
.top-btn.display-link{background:var(--blue);color:#fff;text-decoration:none}
.top-btn.display-link:hover{background:#2563eb}

/* ── Sidebar ── */
.panel-header{padding:12px 14px;font-size:13px;font-weight:700;color:var(--sub);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.icon-btn{width:26px;height:26px;border:none;border-radius:6px;font-size:16px;
  display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text)}
.icon-btn:hover{background:var(--accent)}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-input{width:100%;background:#0a0a1a;border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--sub)}
#song-list{flex:1;overflow-y:auto;padding:6px}
.song-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;
  display:flex;align-items:center;gap:8px;border:1px solid transparent}
.song-item:hover{background:rgba(255,255,255,.05)}
.song-item.active{background:var(--card);border-color:var(--blue)}
.song-num{font-size:12px;color:var(--sub);min-width:28px;font-weight:600}
.song-title{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-edit-btn{font-size:12px;padding:2px 8px;border:1px solid var(--border);border-radius:5px;
  background:none;color:var(--sub);display:none}
.song-item:hover .song-edit-btn{display:block}
.song-edit-btn:hover{background:var(--card);color:var(--text)}

/* ── Main panel ── */
#main-header{padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:52px}
#selected-song-title{font-size:18px;font-weight:700;flex:1}
#selected-song-number{font-size:13px;color:var(--sub)}
#verse-grid{flex:1;overflow-y:auto;padding:12px 16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:10px;align-content:start}
.verse-card{background:var(--panel);border:2px solid var(--border);border-radius:12px;
  padding:14px;cursor:pointer;transition:all .15s;position:relative}
.verse-card:hover{border-color:var(--blue);background:rgba(59,130,246,.1)}
.verse-card.active{border-color:var(--green);background:rgba(34,197,94,.1)}
.verse-label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;
  text-transform:uppercase}
.verse-card.active .verse-label{color:var(--green)}
.verse-text{font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.verse-card.active::after{content:'▶ 표시중';position:absolute;top:8px;right:10px;
  font-size:10px;font-weight:700;color:var(--green)}
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:200px;color:var(--sub);gap:8px}
.empty-state .icon{font-size:48px}
.empty-state p{font-size:15px}

/* ── Right panel ── */
.panel-section{padding:12px 14px;border-bottom:1px solid var(--border)}
.panel-label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;
  text-transform:uppercase;letter-spacing:.5px}
.quick-btn{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text);font-size:13px;font-weight:600;
  margin-bottom:6px;display:flex;align-items:center;gap:8px}
.quick-btn:hover{border-color:var(--accent);background:rgba(233,69,96,.1)}
.quick-btn.danger{border-color:var(--accent)}
.text-area{width:100%;background:#0a0a1a;border:1px solid var(--border);border-radius:8px;
  padding:10px;color:var(--text);font-size:13px;font-family:var(--font);
  resize:none;outline:none;min-height:80px;line-height:1.6}
.text-area:focus{border-color:var(--blue)}
.send-btn{width:100%;padding:9px;border:none;border-radius:8px;
  background:var(--blue);color:#fff;font-size:13px;font-weight:700;margin-top:6px}
.send-btn:hover{background:#2563eb}

/* ── Current display preview ── */
#preview-box{background:#000;border-radius:10px;margin:12px;aspect-ratio:16/9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px;border:2px solid var(--border);overflow:hidden;position:relative}
#preview-box.live{border-color:var(--green)}
#preview-title{font-size:11px;color:#888;text-align:center;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
#preview-text{font-size:12px;color:#fff;text-align:center;line-height:1.5;
  white-space:pre-wrap;word-break:keep-all}
#live-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--green);display:none}
#live-dot.on{display:block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-label{font-size:11px;color:var(--sub);margin:0 14px 0;padding-bottom:4px;
  display:flex;align-items:center;gap:6px}
.preview-label span{flex:1;font-weight:700;color:var(--text)}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
  align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  width:600px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h2{font-size:17px;font-weight:700}
.modal-close{border:none;background:none;color:var(--sub);font-size:24px;cursor:pointer;padding:4px}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--sub);
  margin-bottom:5px;text-transform:uppercase}
.form-group input,.form-group textarea{
  width:100%;background:#0a0a1a;border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:14px;font-family:var(--font);outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--blue)}
.form-group textarea{resize:vertical;min-height:100px;line-height:1.7}
.form-row{display:grid;grid-template-columns:100px 1fr;gap:10px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.btn-save{flex:1;padding:11px;border:none;border-radius:10px;background:var(--blue);
  color:#fff;font-size:15px;font-weight:700;font-family:var(--font)}
.btn-save:hover{background:#2563eb}
.btn-cancel{padding:11px 18px;border:1px solid var(--border);border-radius:10px;
  background:none;color:var(--sub);font-size:15px;font-family:var(--font)}
.btn-del{padding:11px 18px;border:none;border-radius:10px;background:rgba(233,69,96,.15);
  color:var(--accent);font-size:15px;font-family:var(--font)}

/* ── Verses editor ── */
#verses-editor{display:flex;flex-direction:column;gap:8px}
.verse-row{background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.verse-row-header{display:flex;align-items:center;gap:8px}
.verse-label-input{width:90px;background:#0a0a1a;border:1px solid var(--border);
  border-radius:6px;padding:5px 8px;color:var(--text);font-size:13px;font-family:var(--font);
  outline:none}
.verse-label-input:focus{border-color:var(--blue)}
.verse-del-btn{margin-left:auto;background:rgba(233,69,96,.15);border:none;
  border-radius:6px;color:var(--accent);width:28px;height:28px;font-size:16px;
  display:flex;align-items:center;justify-content:center}
.verse-text-input{width:100%;background:#0a0a1a;border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;color:var(--text);font-size:13px;
  font-family:var(--font);resize:vertical;min-height:80px;outline:none;line-height:1.7}
.verse-text-input:focus{border-color:var(--blue)}
.add-verse-btn{padding:8px;border:1px dashed var(--border);border-radius:8px;
  background:none;color:var(--sub);font-size:13px;font-family:var(--font);width:100%}
.add-verse-btn:hover{border-color:var(--blue);color:var(--blue)}

/* ── Bible input ── */
.bible-row{display:flex;gap:6px;margin-bottom:6px}
.bible-book{flex:1;background:#0a0a1a;border:1px solid var(--border);border-radius:8px;
  padding:8px;color:var(--text);font-size:13px;font-family:var(--font);outline:none}
.bible-book:focus{border-color:var(--blue)}
.bible-ch,.bible-vs{width:56px;background:#0a0a1a;border:1px solid var(--border);
  border-radius:8px;padding:8px;color:var(--text);font-size:13px;
  font-family:var(--font);text-align:center;outline:none}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#374151;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#4b5563}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);
  background:#1f2937;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  z-index:900;opacity:0;transition:all .3s;white-space:nowrap;border:1px solid var(--border)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- ── Top bar ── -->
  <div id="topbar">
    <h1>⛪ 교회 자막 시스템</h1>
    <span class="tag">컨트롤러</span>
    <div class="spacer"></div>
    <button class="top-btn blank" onclick="Church.setBlank()">
      ⬛ 화면 끄기
    </button>
    <a class="top-btn display-link" href="/church/display" target="_blank">
      🖥 디스플레이 열기
    </a>
  </div>

  <!-- ── Sidebar: Song list ── -->
  <div id="sidebar">
    <div class="panel-header">
      찬양 목록
      <button class="icon-btn" onclick="Church.openAddSong()" title="새 찬양 추가">+</button>
    </div>
    <div class="search-wrap">
      <input class="search-input" type="search" id="song-search"
        placeholder="제목 또는 번호 검색..." oninput="Church.filterSongs(this.value)">
    </div>
    <div id="song-list"></div>
  </div>

  <!-- ── Main: Verse grid ── -->
  <div id="main">
    <div id="main-header">
      <div>
        <div id="selected-song-title" style="color:var(--sub)">← 왼쪽에서 찬양을 선택하세요</div>
        <div id="selected-song-number"></div>
      </div>
    </div>
    <div id="verse-grid">
      <div class="empty-state">
        <div class="icon">🎵</div>
        <p>찬양을 선택하면 절별 버튼이 표시됩니다</p>
      </div>
    </div>
  </div>

  <!-- ── Right panel ── -->
  <div id="rightpanel">
    <div class="panel-header">현재 화면</div>

    <!-- Preview -->
    <div class="preview-label"><span id="live-status">대기중</span><span id="live-dot"></span></div>
    <div id="preview-box">
      <div id="preview-title"></div>
      <div id="preview-text">화면 꺼짐</div>
    </div>

    <!-- Quick actions -->
    <div class="panel-section">
      <div class="panel-label">빠른 실행</div>
      <button class="quick-btn danger" onclick="Church.setBlank()">
        ⬛ 화면 끄기 (검정)
      </button>
    </div>

    <!-- Custom text -->
    <div class="panel-section" style="flex:1;display:flex;flex-direction:column">
      <div class="panel-label">자유 텍스트</div>
      <input class="text-area" id="custom-title" placeholder="제목 (선택사항)"
        style="margin-bottom:6px;height:36px;min-height:36px;resize:none;padding:8px 10px">
      <textarea class="text-area" id="custom-text" placeholder="표시할 내용을 입력하세요&#10;(예: 성경구절, 공지사항)" style="flex:1"></textarea>
      <button class="send-btn" onclick="Church.sendCustomText()">▶ 화면에 표시</button>
    </div>
  </div>

</div>

<!-- ── Modal: Add/Edit Song ── -->
<div class="modal-bg" id="modal-song">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-song-title">찬양 추가</h2>
      <button class="modal-close" onclick="Church.closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>번호</label>
          <input type="text" id="song-number" placeholder="예) 93"></div>
        <div class="form-group"><label>제목 *</label>
          <input type="text" id="song-title-input" placeholder="예) 주 안에 있는 나에게"></div>
      </div>
      <div class="form-group">
        <label>가사 (절 / 후렴 구분)</label>
        <div id="verses-editor"></div>
        <button class="add-verse-btn" onclick="Church.addVerseRow()">+ 절 추가</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-del" id="btn-del-song" style="display:none" onclick="Church.deleteSong()">삭제</button>
      <button class="btn-cancel" onclick="Church.closeModal()">취소</button>
      <button class="btn-save" onclick="Church.saveSong()">저장</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const Church = {
  songs: [],
  filtered: [],
  selectedSong: null,
  activeVerse: null,
  editingId: null,
  pollInterval: null,
  lastUpdated: 0,

  async init() {
    await this.loadSongs();
    this.startPolling();
  },

  async loadSongs() {
    try {
      const songs = await api('GET', '/church/songs');
      this.songs = songs;
      this.filtered = songs;
      this.renderSongList();
    } catch(e) { this.toast('찬양 목록 로드 실패'); }
  },

  renderSongList(songs = this.filtered) {
    const el = document.getElementById('song-list');
    if(!songs.length) {
      el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--sub);font-size:13px">찬양이 없습니다<br>+ 버튼으로 추가하세요</div>';
      return;
    }
    el.innerHTML = songs.map(s => `
      <div class="song-item ${this.selectedSong?.id===s.id?'active':''}" onclick="Church.selectSong('${s.id}')">
        <span class="song-num">${s.number||''}</span>
        <span class="song-title">${esc(s.title)}</span>
        <button class="song-edit-btn" onclick="event.stopPropagation();Church.openEditSong('${s.id}')">편집</button>
      </div>
    `).join('');
  },

  filterSongs(q) {
    q = q.trim().toLowerCase();
    this.filtered = q
      ? this.songs.filter(s => s.title.toLowerCase().includes(q) || s.number?.includes(q))
      : this.songs;
    this.renderSongList();
  },

  selectSong(id) {
    this.selectedSong = this.songs.find(s => s.id === id);
    this.activeVerse = null;
    this.renderSongList();
    this.renderVerseGrid();
  },

  renderVerseGrid() {
    const titleEl = document.getElementById('selected-song-title');
    const numEl = document.getElementById('selected-song-number');
    const grid = document.getElementById('verse-grid');

    if(!this.selectedSong) {
      titleEl.textContent = '← 왼쪽에서 찬양을 선택하세요';
      titleEl.style.color = 'var(--sub)';
      numEl.textContent = '';
      grid.innerHTML = '<div class="empty-state"><div class="icon">🎵</div><p>찬양을 선택하면 절별 버튼이 표시됩니다</p></div>';
      return;
    }
    const s = this.selectedSong;
    titleEl.textContent = s.title;
    titleEl.style.color = 'var(--text)';
    numEl.textContent = s.number ? `찬송가 ${s.number}장` : '';

    if(!s.verses?.length) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">📝</div><p>가사가 없습니다<br>편집 버튼으로 가사를 추가하세요</p></div>';
      return;
    }

    grid.innerHTML = s.verses.map((v, i) => `
      <div class="verse-card ${this.activeVerse===i?'active':''}"
        onclick="Church.showVerse(${i})">
        <div class="verse-label">${esc(v.label||`${i+1}절`)}</div>
        <div class="verse-text">${esc(v.text)}</div>
      </div>
    `).join('');
  },

  showVerse(idx) {
    if(!this.selectedSong) return;
    const v = this.selectedSong.verses[idx];
    if(!v) return;
    this.activeVerse = idx;
    this.renderVerseGrid();
    this.sendDisplay({
      type: 'song',
      title: this.selectedSong.title + (this.selectedSong.number ? ` (${this.selectedSong.number}장)` : ''),
      text: v.text
    });
  },

  setBlank() {
    this.activeVerse = null;
    this.renderVerseGrid();
    this.sendDisplay({ type: 'blank', title: '', text: '' });
  },

  sendCustomText() {
    const title = document.getElementById('custom-title').value.trim();
    const text = document.getElementById('custom-text').value.trim();
    if(!text) { this.toast('내용을 입력하세요'); return; }
    this.sendDisplay({ type: 'text', title, text });
  },

  async sendDisplay(data) {
    try {
      await api('POST', '/church/display', data);
      this.updatePreview(data);
    } catch(e) { this.toast('전송 실패'); }
  },

  updatePreview(data) {
    const box = document.getElementById('preview-box');
    const titleEl = document.getElementById('preview-title');
    const textEl = document.getElementById('preview-text');
    const dot = document.getElementById('live-dot');
    const status = document.getElementById('live-status');

    if(data.type === 'blank') {
      box.classList.remove('live');
      dot.classList.remove('on');
      titleEl.textContent = '';
      textEl.textContent = '화면 꺼짐';
      textEl.style.color = '#444';
      status.textContent = '대기중';
    } else {
      box.classList.add('live');
      dot.classList.add('on');
      titleEl.textContent = data.title || '';
      textEl.textContent = data.text || '';
      textEl.style.color = '#fff';
      status.textContent = '● 표시중';
    }
  },

  startPolling() {
    this.pollInterval = setInterval(async () => {
      try {
        const state = await api('GET', '/church/display');
        if(state.updated_at !== this.lastUpdated) {
          this.lastUpdated = state.updated_at;
          this.updatePreview(state);
        }
      } catch(e) {}
    }, 1000);
  },

  // ── Song Modal ──
  openAddSong() {
    this.editingId = null;
    document.getElementById('modal-song-title').textContent = '찬양 추가';
    document.getElementById('song-number').value = '';
    document.getElementById('song-title-input').value = '';
    document.getElementById('btn-del-song').style.display = 'none';
    this.renderVersesEditor([
      {label:'1절', text:''},
      {label:'후렴', text:''},
    ]);
    document.getElementById('modal-song').classList.add('open');
    setTimeout(() => document.getElementById('song-title-input').focus(), 100);
  },

  openEditSong(id) {
    const s = this.songs.find(x => x.id === id);
    if(!s) return;
    this.editingId = id;
    document.getElementById('modal-song-title').textContent = '찬양 편집';
    document.getElementById('song-number').value = s.number || '';
    document.getElementById('song-title-input').value = s.title;
    document.getElementById('btn-del-song').style.display = 'block';
    this.renderVersesEditor(s.verses?.length ? s.verses : [{label:'1절',text:''}]);
    document.getElementById('modal-song').classList.add('open');
  },

  closeModal() {
    document.getElementById('modal-song').classList.remove('open');
  },

  renderVersesEditor(verses) {
    const ed = document.getElementById('verses-editor');
    ed.innerHTML = verses.map((v, i) => this.verseRowHtml(i, v.label, v.text)).join('');
  },

  verseRowHtml(i, label='', text='') {
    return `<div class="verse-row" data-idx="${i}">
      <div class="verse-row-header">
        <input class="verse-label-input" value="${esc(label)}" placeholder="절 이름 (예: 1절, 후렴)">
        <button class="verse-del-btn" onclick="this.closest('.verse-row').remove()">×</button>
      </div>
      <textarea class="verse-text-input" rows="4" placeholder="가사를 입력하세요...">${esc(text)}</textarea>
    </div>`;
  },

  addVerseRow() {
    const ed = document.getElementById('verses-editor');
    const count = ed.querySelectorAll('.verse-row').length;
    const div = document.createElement('div');
    div.innerHTML = this.verseRowHtml(count);
    ed.appendChild(div.firstElementChild);
    div.firstElementChild?.querySelector('.verse-text-input')?.focus();
  },

  getVerseData() {
    return Array.from(document.querySelectorAll('#verses-editor .verse-row')).map(row => ({
      label: row.querySelector('.verse-label-input').value.trim(),
      text: row.querySelector('.verse-text-input').value.trim()
    })).filter(v => v.text);
  },

  async saveSong() {
    const title = document.getElementById('song-title-input').value.trim();
    const number = document.getElementById('song-number').value.trim();
    if(!title) { this.toast('제목을 입력하세요'); return; }
    const verses = this.getVerseData();
    const data = { title, number, verses };
    try {
      if(this.editingId) {
        const updated = await api('PUT', '/church/songs/' + this.editingId, data);
        const idx = this.songs.findIndex(s => s.id === this.editingId);
        if(idx >= 0) this.songs[idx] = updated;
        if(this.selectedSong?.id === this.editingId) {
          this.selectedSong = updated;
          this.activeVerse = null;
          this.renderVerseGrid();
        }
        this.toast('수정됐습니다');
      } else {
        const song = await api('POST', '/church/songs', data);
        this.songs.push(song);
        this.toast('추가됐습니다');
      }
      this.filtered = this.songs;
      this.renderSongList();
      this.closeModal();
    } catch(e) { this.toast('저장 실패: ' + (e.message||'오류')); }
  },

  async deleteSong() {
    if(!this.editingId) return;
    const s = this.songs.find(x => x.id === this.editingId);
    if(!confirm(`"${s?.title}" 찬양을 삭제할까요?`)) return;
    try {
      await api('DELETE', '/church/songs/' + this.editingId);
      this.songs = this.songs.filter(x => x.id !== this.editingId);
      this.filtered = this.songs;
      if(this.selectedSong?.id === this.editingId) {
        this.selectedSong = null;
        this.activeVerse = null;
        this.renderVerseGrid();
      }
      this.renderSongList();
      this.closeModal();
      this.toast('삭제됐습니다');
    } catch(e) { this.toast('삭제 실패'); }
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._t);
    this._t = setTimeout(() => el.classList.remove('show'), 2500);
  }
};

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if(body) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Modal backdrop close
document.getElementById('modal-song').addEventListener('click', e => {
  if(e.target === document.getElementById('modal-song'))
    Church.closeModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') {
    if(document.getElementById('modal-song').classList.contains('open')) {
      Church.closeModal();
    } else {
      Church.setBlank();
    }
  }
});

Church.init();
</script>
</body>
</html>

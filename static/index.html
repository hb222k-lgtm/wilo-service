<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="윌로서비스">
<title>윌로 서비스 관리</title>
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f2f7;--card:#fff;--primary:#0066cc;--danger:#ff3b30;--success:#34c759;
  --warn:#ff9500;--text:#1c1c1e;--sub:#8e8e93;--border:#e5e5ea;
  --nav-h:83px;--top-safe:env(safe-area-inset-top);--bot-safe:env(safe-area-inset-bottom);
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,sans-serif;color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--nav-h)}
.page{display:none;padding:0 0 16px}
.page.active{display:block}

/* Top bar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top-safe) + 8px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border)}
.topbar h1{font-size:22px;font-weight:700}
.topbar .btn-icon{width:36px;height:36px;border:none;background:var(--primary);color:#fff;border-radius:50%;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Bottom nav */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(255,255,255,.9);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--bot-safe)}
.nav-btn{flex:1;border:none;background:none;padding:8px 0;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;color:var(--sub);cursor:pointer;transition:color .15s}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{width:24px;height:24px}

/* Cards */
.card{background:var(--card);border-radius:12px;margin:8px 16px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px;
  display:flex;align-items:center;justify-content:space-between}
.card-row{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:12px;cursor:pointer;active:background:#f2f2f7}
.card-row:last-child{border-bottom:none}
.card-row:active{background:var(--bg)}
.card-row .icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0}
.card-row .info{flex:1;min-width:0}
.card-row .info .title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .info .sub{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chevron{color:var(--sub);font-size:12px}

/* Section label */
.section-label{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;
  padding:16px 16px 4px;letter-spacing:.5px}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge-blue{background:#e3f0ff;color:#0066cc}
.badge-green{background:#e3f9e5;color:#1d8a35}
.badge-orange{background:#fff3e0;color:#c05800}
.badge-red{background:#ffe3e3;color:#c0001a}

/* Search bar */
.search-wrap{padding:8px 16px}
.search-box{display:flex;align-items:center;background:var(--card);border-radius:10px;
  padding:8px 12px;gap:8px;border:1px solid var(--border)}
.search-box svg{color:var(--sub);flex-shrink:0}
.search-box input{border:none;outline:none;width:100%;font-size:15px;background:none}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;
  align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--bot-safe) + 16px)}
.modal-header{padding:16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h2{font-size:17px;font-weight:600}
.modal-close{border:none;background:none;font-size:24px;color:var(--sub);cursor:pointer;padding:4px}
.modal-body{padding:16px}

/* Forms */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:5px}
.form-group input,.form-group textarea,.form-group select{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-size:15px;outline:none;background:#fff;font-family:inherit;color:var(--text)}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn{display:block;width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;
  font-weight:600;cursor:pointer;text-align:center}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.8}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:14px;border-radius:8px;display:inline-block;width:auto}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:8px 16px}
.photo-item{position:relative;aspect-ratio:1;overflow:hidden;border-radius:4px;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover}
.photo-item .del-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);
  border:none;color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-photo{aspect-ratio:1;border:2px dashed var(--border);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;color:var(--sub);cursor:pointer;gap:4px}
.add-photo:active{background:var(--bg)}
#photoInput{display:none}

/* Calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.cal-nav h2{font-size:18px;font-weight:700}
.cal-nav button{border:none;background:none;font-size:22px;color:var(--primary);
  cursor:pointer;padding:4px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);margin:0 8px}
.cal-day-name{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding:6px 0}
.cal-day{text-align:center;padding:4px 2px;cursor:pointer;border-radius:8px;min-height:44px}
.cal-day .num{font-size:14px;font-weight:500;width:28px;height:28px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;margin:0 auto}
.cal-day.today .num{background:var(--primary);color:#fff}
.cal-day.selected .num{background:#e3f0ff;color:var(--primary)}
.cal-day.other-month .num{color:var(--sub)}
.cal-day .dots{display:flex;justify-content:center;gap:2px;margin-top:2px}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.cal-day .dot.done{background:var(--success)}
.schedule-list{margin:0 16px}
.sched-item{background:var(--card);border-radius:10px;padding:12px;margin-bottom:8px;
  display:flex;align-items:flex-start;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sched-time{font-size:13px;color:var(--sub);min-width:42px;font-weight:600}
.sched-info{flex:1}
.sched-info .title{font-size:15px;font-weight:500}
.sched-info .site{font-size:13px;color:var(--sub);margin-top:2px}
.sched-actions{display:flex;gap:6px}
.sched-dot{width:10px;height:10px;border-radius:50%;background:var(--warn);margin-top:5px;flex-shrink:0}
.sched-dot.done{background:var(--success)}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);
  position:sticky;top:57px;z-index:50}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;color:var(--sub);
  cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:900;
  align-items:center;justify-content:center;flex-direction:column}
#lightbox.open{display:flex}
#lightbox img{max-width:100%;max-height:85vh;object-fit:contain}
#lightbox .close{position:absolute;top:calc(var(--top-safe) + 10px);right:16px;
  border:none;background:none;color:#fff;font-size:32px;cursor:pointer}

/* Toast */
#toast{position:fixed;bottom:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,.92);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:14px;z-index:800;opacity:0;transition:all .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Memo cards */
.memo-card{background:var(--card);border-radius:12px;margin:8px 16px;padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;position:relative}
.memo-card:active{opacity:.85}
.memo-card .memo-title{font-size:15px;font-weight:600;margin-bottom:4px}
.memo-card .memo-body{font-size:13px;color:var(--sub);white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.memo-card .memo-date{font-size:12px;color:var(--sub);margin-top:6px}
.memo-card .memo-actions{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}

/* Offline banner */
#offline-banner{display:none;background:var(--warn);color:#fff;text-align:center;
  padding:6px;font-size:13px;font-weight:600}
#offline-banner.show{display:block}

/* Empty state */
.empty{text-align:center;padding:48px 24px;color:var(--sub)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px}

/* Visit status */
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.status-completed{background:#e3f9e5;color:#1d8a35}
.status-pending{background:#fff3e0;color:#c05800}

/* Detail header */
.detail-header{padding:16px;background:var(--card);margin-bottom:4px}
.detail-header h2{font-size:20px;font-weight:700;margin-bottom:4px}
.detail-header .addr{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:4px}
.detail-actions{display:flex;gap:8px;margin-top:12px}
.detail-actions a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px;border-radius:10px;background:var(--bg);border:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;cursor:pointer}
.detail-actions a:active{background:var(--border)}

/* Divider */
.divider{height:8px;background:var(--bg)}

/* Home stats */
.stats-row{display:flex;gap:10px;margin:8px 16px}
.stat-card{flex:1;background:var(--card);border-radius:12px;padding:14px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:12px;color:var(--sub);margin-top:2px}
</style>
</head>
<body>
<div id="app">
  <div id="offline-banner">오프라인 모드 — 저장된 데이터를 표시합니다</div>
  <div id="content">

    <!-- ── HOME ── -->
    <div id="page-home" class="page active">
      <div class="topbar">
        <h1>윌로 서비스</h1>
        <button class="btn-icon" onclick="App.showAddSchedule()" title="일정 추가">+</button>
      </div>
      <div id="home-content"></div>
    </div>

    <!-- ── SITES ── -->
    <div id="page-sites" class="page">
      <div class="topbar">
        <h1>현장 목록</h1>
        <button class="btn-icon" onclick="App.showAddSite()">+</button>
      </div>
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="site-search" placeholder="현장명, 주소 검색" oninput="App.filterSites(this.value)">
        </div>
      </div>
      <div id="sites-list"></div>
    </div>

    <!-- ── SITE DETAIL ── -->
    <div id="page-detail" class="page">
      <div class="topbar" id="detail-topbar">
        <button style="background:none;border:none;color:var(--primary);font-size:16px;cursor:pointer;font-weight:500" onclick="App.navigate('sites')">← 뒤로</button>
        <div style="display:flex;gap:8px">
          <button class="btn-icon" style="background:var(--bg);color:var(--text);font-size:14px" onclick="App.editCurrentSite()">편집</button>
          <button class="btn-icon" style="background:var(--danger)" onclick="App.deleteCurrentSite()">🗑</button>
        </div>
      </div>
      <div id="detail-content"></div>
    </div>

    <!-- ── SCHEDULE ── -->
    <div id="page-schedule" class="page">
      <div class="topbar">
        <h1>일정</h1>
        <button class="btn-icon" onclick="App.showAddSchedule()">+</button>
      </div>
      <div id="schedule-content"></div>
    </div>

    <!-- ── SEARCH ── -->
    <div id="page-memo" class="page">
      <div class="topbar">
        <h1>메모</h1>
        <button class="btn-icon" onclick="App.showAddMemo()">+</button>
      </div>
      <div id="memo-list"></div>
    </div>

    <div id="page-search" class="page">
      <div class="topbar"><h1>검색</h1></div>
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="global-search" placeholder="현장명, 주소, 작업내용 검색" oninput="App.globalSearch(this.value)" autofocus>
        </div>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav id="nav">
    <button class="nav-btn active" data-page="home" onclick="App.navigate('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      홈
    </button>
    <button class="nav-btn" data-page="sites" onclick="App.navigate('sites')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      현장
    </button>
    <button class="nav-btn" data-page="schedule" onclick="App.navigate('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      일정
    </button>
    <button class="nav-btn" data-page="memo" onclick="App.navigate('memo')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      메모
    </button>
    <button class="nav-btn" data-page="search" onclick="App.navigate('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      검색
    </button>
  </nav>
</div>

<!-- Memo Modal -->
<div class="modal-bg" id="modal-memo">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-memo-title">메모 추가</h2>
      <button class="modal-close" onclick="App.closeModal('modal-memo')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="memo-id">
      <div class="form-group"><label>제목 *</label><input type="text" id="memo-title" placeholder="메모 제목"></div>
      <div class="form-group"><label>내용</label><textarea id="memo-content" placeholder="자유롭게 메모하세요..." style="min-height:160px"></textarea></div>
      <button class="btn btn-primary" onclick="App.saveMemo()">저장</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="this.classList.remove('open')">
  <button class="close" onclick="document.getElementById('lightbox').classList.remove('open')">×</button>
  <img id="lightbox-img" src="">
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Photo input -->
<input type="file" id="photoInput" accept="image/*" multiple>

<!-- ── MODALS ── -->

<!-- Add/Edit Site -->
<div class="modal-bg" id="modal-site">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-site-title">현장 추가</h2>
      <button class="modal-close" onclick="App.closeModal('modal-site')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="site-id">
      <div class="form-group"><label>현장명 *</label><input type="text" id="site-name" placeholder="예) 강남구청 기계실"></div>
      <div class="form-group"><label>주소</label><input type="text" id="site-address" placeholder="예) 서울시 강남구 학동로 426"></div>
      <div class="form-row">
        <div class="form-group"><label>담당자</label><input type="text" id="site-contact-name" placeholder="홍길동"></div>
        <div class="form-group"><label>연락처</label><input type="tel" id="site-contact-phone" placeholder="010-0000-0000"></div>
      </div>
      <div class="form-group"><label>메모</label><textarea id="site-memo" placeholder="특이사항, 비고 등"></textarea></div>
      <button class="btn btn-primary" onclick="App.saveSite()">저장</button>
    </div>
  </div>
</div>

<!-- Add/Edit Visit -->
<div class="modal-bg" id="modal-visit">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-visit-title">방문 기록 추가</h2>
      <button class="modal-close" onclick="App.closeModal('modal-visit')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="visit-id">
      <input type="hidden" id="visit-site-id">
      <div class="form-group"><label>방문 날짜 *</label><input type="date" id="visit-date"></div>
      <div class="form-group"><label>작업 내용</label><textarea id="visit-work" placeholder="펌프 점검, 임펠러 교체 등"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>담당자</label><input type="text" id="visit-engineer" placeholder="김기사"></div>
        <div class="form-group"><label>상태</label>
          <select id="visit-status">
            <option value="completed">완료</option>
            <option value="pending">예정</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>메모</label><textarea id="visit-memo" placeholder="특이사항"></textarea></div>
      <div class="form-group">
        <label>사진</label>
        <div id="visit-photo-preview" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px"></div>
        <input type="file" id="visitPhotoInput" accept="image/*" multiple style="display:none">
        <button type="button" class="btn btn-outline" style="padding:10px;font-size:14px" onclick="document.getElementById('visitPhotoInput').click()">📷 사진 선택</button>
      </div>
      <button class="btn btn-primary" onclick="App.saveVisit()">저장</button>
    </div>
  </div>
</div>

<!-- Add/Edit Schedule -->
<div class="modal-bg" id="modal-schedule">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-sched-title">일정 추가</h2>
      <button class="modal-close" onclick="App.closeModal('modal-schedule')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="sched-id">
      <div class="form-group"><label>제목 *</label><input type="text" id="sched-title" placeholder="예) 정기 점검, 펌프 교체"></div>
      <div class="form-group">
        <label>현장 (선택)</label>
        <div id="sched-site-wrap" style="position:relative">
          <input type="text" id="sched-site-search" placeholder="현장명 검색..." autocomplete="off"
            oninput="App.filterSiteList()" onfocus="App.openSiteList()" onblur="App.blurSiteList()">
          <input type="hidden" id="sched-site">
          <div id="sched-site-list" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:50;
            background:#fff;border:1px solid var(--border);border-radius:10px;max-height:220px;
            overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.12)"></div>
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="sched-tbd" onchange="App.toggleTbd()" style="width:18px;height:18px;cursor:pointer">
          <span>날짜 미정 (방문 요청만 기록)</span>
        </label>
      </div>
      <div id="sched-date-row" class="form-row">
        <div class="form-group"><label>날짜 *</label><input type="date" id="sched-date"></div>
        <div class="form-group"><label>시간</label><input type="time" id="sched-time"></div>
      </div>
      <div class="form-group"><label>메모</label><textarea id="sched-memo" placeholder="준비물, 주의사항 등"></textarea></div>
      <div class="form-group">
        <label>사진</label>
        <div id="sched-photo-preview" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px"></div>
        <input type="file" id="schedPhotoInput" accept="image/*" multiple style="display:none">
        <button type="button" class="btn btn-outline" style="padding:10px;font-size:14px" onclick="document.getElementById('schedPhotoInput').click()">📷 사진 선택</button>
      </div>
      <button class="btn btn-primary" onclick="App.saveSchedule()">저장</button>
    </div>
  </div>
</div>

<script>
const TODAY = new Date().toISOString().slice(0,10);

// ── 오프라인 큐 ────────────────────────────────────────────────────────────
const Queue = {
  _k: 'wilo_queue',
  all()  { try { return JSON.parse(localStorage.getItem(this._k)||'[]'); } catch(e){ return []; } },
  count(){ return this.all().length; },
  add(method, path, body) {
    const q = this.all();
    q.push({ qid: 'q'+Date.now()+Math.random().toString(36).slice(2), method, path, body });
    localStorage.setItem(this._k, JSON.stringify(q));
  },
  remove(qid) {
    localStorage.setItem(this._k, JSON.stringify(this.all().filter(o=>o.qid!==qid)));
  },
  async flush() {
    const ops = this.all();
    if(!ops.length) return 0;
    let ok = 0;
    for(const op of ops) {
      try {
        const opts = {method:op.method, headers:{'Content-Type':'application/json'}};
        if(op.body) opts.body = JSON.stringify(op.body);
        const r = await fetch('/api'+op.path, opts);
        if(r.ok) { this.remove(op.qid); ok++; }
        else break;
      } catch(e) { break; }
    }
    return ok;
  }
};

// ── API ────────────────────────────────────────────────────────────────────
const API = {
  async req(method, path, body) {
    let r;
    try {
      const opts = {method, headers:{'Content-Type':'application/json'}};
      if(body) opts.body = JSON.stringify(body);
      r = await fetch('/api' + path, opts);
    } catch(e) {
      App.setOffline(true);
      if(method === 'GET') {
        const cached = localStorage.getItem('cache:' + path);
        if(cached) return JSON.parse(cached);
        throw new Error('오프라인 — 저장된 데이터가 없습니다');
      }
      // 쓰기 작업은 큐에 저장 후 나중에 자동 동기화
      Queue.add(method, path, body);
      App.updateQueueBadge();
      // 호출부에서 사용할 임시 응답 반환
      return { id: 'pending_'+Date.now(), _queued: true, ...(body||{}) };
    }
    App.setOffline(false);
    if(Queue.count()) App.syncQueue(); // 온라인 복귀 시 큐 처리
    if(!r.ok) {
      let msg = `서버 오류 (${r.status})`;
      try { const j = await r.json(); if(j.error) msg = j.error; } catch(_){}
      throw new Error(msg);
    }
    const data = await r.json();
    if(method==='GET') localStorage.setItem('cache:' + path, JSON.stringify(data));
    return data;
  },
  get(p){return this.req('GET',p)},
  post(p,b){return this.req('POST',p,b)},
  put(p,b){return this.req('PUT',p,b)},
  del(p){return this.req('DELETE',p)},

  async upload(path, formData) {
    let r;
    try {
      r = await fetch('/api' + path, {method:'POST', body:formData});
    } catch(e) {
      App.setOffline(true);
      App.toast('📵 오프라인 — 사진은 온라인 상태에서만 업로드 가능합니다','warn');
      throw new Error('오프라인');
    }
    App.setOffline(false);
    if(!r.ok) throw new Error(`서버 오류 (${r.status})`);
    return await r.json();
  }
};

// ── App ────────────────────────────────────────────────────────────────────
const App = {
  currentPage: 'home',
  currentSite: null,
  currentTab: 'info',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  calSelected: TODAY,
  schedules: [],
  sites: [],
  offline: false,

  setOffline(v) {
    this.offline = v;
    this.updateQueueBadge();
  },

  updateQueueBadge() {
    const banner = document.getElementById('offline-banner');
    const cnt = Queue.count();
    if(this.offline) {
      banner.innerHTML = cnt
        ? `📵 오프라인 — 저장 대기 ${cnt}건 (온라인 복귀 시 자동 동기화) <button onclick="App.renderHome()" style="margin-left:8px;border:none;background:rgba(255,255,255,.3);color:#fff;padding:2px 10px;border-radius:10px;font-size:12px;cursor:pointer">새로고침</button>`
        : `📵 오프라인 — 저장된 데이터를 표시합니다 <button onclick="App.renderHome()" style="margin-left:8px;border:none;background:rgba(255,255,255,.3);color:#fff;padding:2px 10px;border-radius:10px;font-size:12px;cursor:pointer">새로고침</button>`;
      banner.style.display = 'block';
    } else if(cnt) {
      banner.innerHTML = `🔄 동기화 중... (${cnt}건 남음)`;
      banner.style.background = 'var(--primary)';
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }
  },

  async syncQueue() {
    if(this._syncing) return;
    this._syncing = true;
    const synced = await Queue.flush();
    this._syncing = false;
    if(synced > 0) {
      this.toast(`✅ ${synced}건 동기화 완료`);
      this.updateQueueBadge();
      if(this.currentPage === 'home') this.renderHome();
      else if(this.currentPage === 'sites') this.renderSites();
      else if(this.currentPage === 'detail' && this.currentSite) this.renderDetail(this.currentSite.id);
      else if(this.currentPage === 'schedule') this.renderSchedule();
    }
    this.updateQueueBadge();
  },

  navigate(page, siteId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    const nb = document.querySelector(`.nav-btn[data-page="${page}"]`);
    if(nb) nb.classList.add('active');
    this.currentPage = page;

    if(page === 'home') this.renderHome();
    else if(page === 'sites') this.renderSites();
    else if(page === 'detail' && siteId) this.renderDetail(siteId);
    else if(page === 'schedule') this.renderSchedule();
    else if(page === 'memo') this.renderMemo();
    else if(page === 'search') document.getElementById('global-search').focus();

    window.scrollTo(0,0);
    document.getElementById('content').scrollTop = 0;
  },

  // ── HOME ──────────────────────────────────────────────────────────────
  async renderHome() {
    const el = document.getElementById('home-content');
    el.innerHTML = `<div class="empty" style="padding:32px"><p style="color:var(--sub)">불러오는 중...</p></div>`;

    // 각 섹션을 독립적으로 로드 — 하나 실패해도 나머지는 표시
    const [allPending, visits, sites] = await Promise.all([
      API.get('/schedules?pending=1').catch(() => []),
      API.get('/visits').catch(() => []),
      API.get('/sites').catch(() => []),
    ]);

    // 홈에서도 완료/삭제 버튼이 동작하도록 캐시 저장
    if(allPending.length || !this.schedules.length) this.schedules = allPending;
    if(sites.length) this.sites = sites;

    const schedules      = allPending;
    const todayPending   = schedules.filter(s => s.scheduled_date === TODAY);
    const overdue        = schedules.filter(s => s.scheduled_date && s.scheduled_date < TODAY).sort((a,b) => a.scheduled_date > b.scheduled_date ? -1 : 1);
    const upcomingScheds = schedules.filter(s => s.scheduled_date > TODAY).slice(0, 5);
    const waitingReqs    = schedules.filter(s => !s.scheduled_date);
    const todayDone      = []; // pending=1 이므로 완료는 없음
    const recentVisits   = visits.slice(0, 5);
    const isOffline      = this.offline;

    let html = '';

    if(isOffline) {
      html += `<div style="background:#fff3e0;padding:10px 16px;font-size:13px;color:#c05800;display:flex;align-items:center;gap:8px">
        <span>⚠️</span><span>서버에 연결할 수 없어 저장된 데이터를 표시합니다</span>
        <button onclick="App.renderHome()" style="margin-left:auto;border:none;background:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer">새로고침</button>
      </div>`;
    }

    html += `<div class="stats-row">
      <div class="stat-card"><div class="num">${sites.length}</div><div class="label">전체 현장</div></div>
      <div class="stat-card"><div class="num">${todayPending.length}</div><div class="label">오늘 남은</div></div>
      <div class="stat-card" style="${overdue.length?'color:var(--danger)':''}"><div class="num">${overdue.length}</div><div class="label">미완료</div></div>
    </div>`;

    if(todayPending.length) {
      html += `<div class="section-label">오늘 할 일</div>`;
      todayPending.forEach(s => {
        html += `<div class="sched-item" style="margin:0 16px 8px">
          <div class="sched-dot"></div>
          <div class="sched-info">
            <div class="title">${esc(s.title)}</div>
            ${s.site_name ? `<div class="site">📍 ${esc(s.site_name)}</div>` : ''}
            ${s.scheduled_time ? `<div class="site">🕐 ${s.scheduled_time}</div>` : ''}
          </div>
          <div class="sched-actions">
            <button class="btn btn-sm badge-green" onclick="App.completeSchedule('${s.id}')">완료</button>
            <button class="btn btn-sm btn-outline" onclick="App.deleteSchedule('${s.id}')">삭제</button>
          </div>
        </div>`;
      });
    }

    if(overdue.length) {
      html += `<div class="section-label" style="color:var(--danger)">⚠️ 미완료 지난 일정 (${overdue.length}건)</div>`;
      overdue.forEach(s => {
        html += `<div class="sched-item" style="margin:0 16px 8px;border-left:3px solid var(--danger)">
          <div class="sched-dot" style="background:var(--danger)"></div>
          <div class="sched-info">
            <div class="title">${esc(s.title)}</div>
            <div class="site" style="color:var(--danger)">${fmtDate(s.scheduled_date)} ${s.site_name ? '| 📍'+esc(s.site_name) : ''}</div>
            ${s.memo ? `<div class="site">${esc(s.memo)}</div>` : ''}
          </div>
          <div class="sched-actions">
            <button class="btn btn-sm badge-green" onclick="App.completeSchedule('${s.id}')">완료</button>
            <button class="btn btn-sm btn-outline" onclick="App.editSchedule('${s.id}')">편집</button>
          </div>
        </div>`;
      });
    }

    if(upcomingScheds.length) {
      html += `<div class="section-label">예정 일정</div>`;
      upcomingScheds.forEach(s => {
        html += `<div class="sched-item" style="margin:0 16px 8px">
          <div class="sched-dot"></div>
          <div class="sched-info">
            <div class="title">${esc(s.title)}</div>
            <div class="site">${fmtDate(s.scheduled_date)} ${s.scheduled_time||''} ${s.site_name ? '| '+esc(s.site_name) : ''}</div>
          </div>
        </div>`;
      });
    }

    if(waitingReqs.length) {
      html += `<div class="section-label">📋 대기 요청 (날짜 미정)</div>`;
      waitingReqs.forEach(s => {
        html += `<div class="sched-item" style="margin:0 16px 8px;border-left:3px solid var(--warn)">
          <div class="sched-dot" style="background:var(--warn)"></div>
          <div class="sched-info">
            <div class="title">${esc(s.title)}</div>
            ${s.site_name ? `<div class="site">📍 ${esc(s.site_name)}</div>` : ''}
            ${s.memo ? `<div class="site">${esc(s.memo)}</div>` : ''}
          </div>
          <div class="sched-actions">
            <button class="btn btn-sm badge-blue" onclick="App.scheduleRequest('${s.id}')">일정 잡기</button>
            <button class="btn btn-sm btn-outline" onclick="App.deleteSchedule('${s.id}')">삭제</button>
          </div>
        </div>`;
      });
    }

    if(recentVisits.length) {
      html += `<div class="section-label">최근 방문</div><div class="card">`;
      recentVisits.forEach(v => {
        html += `<div class="card-row" onclick="App.navigate('detail','${v.site_id}')">
          <div class="icon" style="background:#e3f0ff">🔧</div>
          <div class="info">
            <div class="title">${esc(v.site_name||'(현장없음)')}</div>
            <div class="sub">${fmtDate(v.visit_date)} · ${esc(v.work_content||'작업내용 없음')}</div>
          </div>
          <span class="chevron">›</span>
        </div>`;
      });
      html += `</div>`;
    }

    if(!todayPending.length && !upcomingScheds.length && !recentVisits.length) {
      html += `<div class="empty"><div class="icon">📋</div><p>등록된 일정이나 방문 기록이 없습니다<br>오른쪽 상단 + 버튼으로 일정을 추가하세요</p></div>`;
    }

    el.innerHTML = html;
  },

  // ── SITES ─────────────────────────────────────────────────────────────
  async renderSites(q='') {
    const el = document.getElementById('sites-list');
    try {
      const url = q ? `/sites?q=${encodeURIComponent(q)}` : '/sites';
      const sites = await API.get(url);
      if(!q) this.sites = sites; // 검색 중엔 전체 목록 덮어쓰지 않음
      if(!sites.length) {
        el.innerHTML = `<div class="empty"><div class="icon">🏭</div><p>등록된 현장이 없습니다<br>+ 버튼으로 현장을 추가하세요</p></div>`;
        return;
      }
      let html = '<div class="card">';
      sites.forEach(s => {
        html += `<div class="card-row" onclick="App.navigate('detail','${s.id}')">
          <div class="icon" style="background:#e8f5e9">🏭</div>
          <div class="info">
            <div class="title">${esc(s.name)}</div>
            <div class="sub">${esc(s.address||'주소 없음')}</div>
          </div>
          <span class="chevron">›</span>
        </div>`;
      });
      html += '</div>';
      el.innerHTML = html;
    } catch(e) {
      el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>현장 목록을 불러올 수 없습니다</p></div>`;
    }
  },

  filterSites(q) {
    clearTimeout(this._filterTimer);
    this._filterTimer = setTimeout(() => this.renderSites(q), 300);
  },

  // ── DETAIL ────────────────────────────────────────────────────────────
  async renderDetail(siteId) {
    const el = document.getElementById('detail-content');
    el.innerHTML = '<div class="empty"><p>불러오는 중...</p></div>';
    try {
      const [site, visits, photos] = await Promise.all([
        API.get('/sites/' + siteId),
        API.get('/sites/' + siteId + '/visits'),
        API.get('/sites/' + siteId + '/photos')
      ]);
      this.currentSite = site;
      this.currentVisits = visits;
      this.currentPhotos = photos;
      this.renderDetailContent(site, visits, photos, this.currentTab);
    } catch(e) {
      el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>현장 정보를 불러올 수 없습니다</p></div>`;
    }
  },

  renderDetailContent(site, visits, photos, tab) {
    this.currentTab = tab;
    let html = `
      <div class="detail-header">
        <h2>${esc(site.name)}</h2>
        ${site.address ? `<div class="addr">📍 ${esc(site.address)}</div>` : ''}
        <div class="detail-actions">
          ${site.contact_phone ? `<a href="tel:${site.contact_phone}">📞 전화</a>` : ''}
          ${site.address ? `<a href="https://maps.apple.com/?q=${encodeURIComponent(site.address)}" target="_blank">🗺 지도</a>` : ''}
          <a onclick="App.showAddVisit()">🔧 방문기록 추가</a>
        </div>
      </div>
      <div class="tabs">
        <div class="tab ${tab==='info'?'active':''}" onclick="App.switchTab('info')">정보</div>
        <div class="tab ${tab==='visits'?'active':''}" onclick="App.switchTab('visits')">방문기록 <span class="badge badge-blue">${visits.length}</span></div>
      </div>`;

    if(tab === 'info') {
      html += `<div style="padding:16px">`;
      if(site.contact_name || site.contact_phone) {
        html += `<div class="card" style="margin:0 0 12px"><div class="card-header">담당자 정보</div>
          <div style="padding:12px 16px">
            ${site.contact_name ? `<div style="margin-bottom:6px">👤 ${esc(site.contact_name)}</div>` : ''}
            ${site.contact_phone ? `<div>📞 <a href="tel:${site.contact_phone}" style="color:var(--primary)">${esc(site.contact_phone)}</a></div>` : ''}
          </div></div>`;
      }
      if(site.memo) {
        html += `<div class="card" style="margin:0"><div class="card-header">메모</div>
          <div style="padding:12px 16px;font-size:15px;white-space:pre-wrap">${esc(site.memo)}</div></div>`;
      }
      if(!site.contact_name && !site.contact_phone && !site.memo) {
        html += `<div class="empty"><div class="icon">📝</div><p>추가 정보가 없습니다<br>편집 버튼으로 정보를 입력하세요</p></div>`;
      }
      html += `</div>`;
    } else if(tab === 'visits') {
      if(!visits.length) {
        html += `<div class="empty"><div class="icon">🔧</div><p>방문 기록이 없습니다<br>위의 방문기록 추가 버튼을 눌러주세요</p></div>`;
      } else {
        html += `<div style="padding:8px 16px">`;
        visits.forEach(v => {
          const visitPhotos = photos.filter(p => p.visit_id === v.id);
          html += `<div class="card" style="margin:0 0 12px">
            <div style="padding:12px 14px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-weight:600">${fmtDate(v.visit_date)}</span>
                <span class="status-pill status-${v.status}">${v.status==='completed'?'완료':'예정'}</span>
              </div>
              ${v.work_content ? `<div style="font-size:14px;color:var(--text);margin-bottom:4px">${esc(v.work_content)}</div>` : ''}
              ${v.engineer ? `<div style="font-size:13px;color:var(--sub)">담당: ${esc(v.engineer)}</div>` : ''}
              ${v.memo ? `<div style="font-size:13px;color:var(--sub);margin-top:4px">${esc(v.memo)}</div>` : ''}
            </div>
            ${visitPhotos.length ? `
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:3px">
              ${visitPhotos.map(p => `
                <div style="position:relative;aspect-ratio:4/3;border-radius:6px;overflow:hidden">
                  <img src="/api/thumb/${site.id}/${p.filename}" loading="lazy"
                    onclick="App.openLightbox('/api/photo/${site.id}/${p.filename}')"
                    style="width:100%;height:100%;object-fit:cover;cursor:pointer">
                  <button class="del-btn" onclick="App.deletePhoto('${p.id}')">×</button>
                </div>`).join('')}
            </div>` : ''}
            <div style="padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
              <button class="btn btn-sm btn-outline" onclick="App.triggerPhotoForVisit('${v.id}')">📷 사진 추가</button>
              <button class="btn btn-sm btn-outline" onclick="App.editVisit('${v.id}')">편집</button>
              <button class="btn btn-sm" style="background:#fff3e0;color:#c05800" onclick="App.deleteVisit('${v.id}')">삭제</button>
            </div>
          </div>`;
        });
        html += `</div>`;
      }
    }

    document.getElementById('detail-content').innerHTML = html;
  },

  switchTab(tab) {
    if(this.currentSite) this.renderDetailContent(this.currentSite, this.currentVisits, this.currentPhotos, tab);
  },

  openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').classList.add('open');
  },

  // ── SCHEDULE ──────────────────────────────────────────────────────────
  async renderSchedule() {
    try {
      const month = `${this.calYear}-${String(this.calMonth+1).padStart(2,'0')}`;
      this.schedules = await API.get('/schedules?month=' + month);
      // 각 일정의 사진 로드
      this.schedulePhotos = {};
      await Promise.all(this.schedules.map(async s => {
        try {
          const photos = await API.get('/schedules/'+s.id+'/photos');
          if(photos.length) this.schedulePhotos[s.id] = photos;
        } catch(e) {}
      }));
      this.renderCalendar();
    } catch(e) {
      document.getElementById('schedule-content').innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>일정을 불러올 수 없습니다</p></div>`;
    }
  },

  renderCalendar() {
    const month = `${this.calYear}-${String(this.calMonth+1).padStart(2,'0')}`;
    const days = ['일','월','화','수','목','금','토'];
    const firstDay = new Date(this.calYear, this.calMonth, 1).getDay();
    const lastDate = new Date(this.calYear, this.calMonth+1, 0).getDate();
    const prevLast = new Date(this.calYear, this.calMonth, 0).getDate();

    const schedByDate = {};
    this.schedules.forEach(s => {
      if(!schedByDate[s.scheduled_date]) schedByDate[s.scheduled_date] = [];
      schedByDate[s.scheduled_date].push(s);
    });

    let html = `
      <div class="cal-nav">
        <button onclick="App.calPrev()">‹</button>
        <h2>${this.calYear}년 ${this.calMonth+1}월</h2>
        <button onclick="App.calNext()">›</button>
      </div>
      <div class="card" style="margin:0 8px">
      <div class="cal-grid">`;

    days.forEach(d => html += `<div class="cal-day-name" style="${d==='일'?'color:#ff3b30':d==='토'?'color:#0066cc':''}">${d}</div>`);

    let cells = [];
    for(let i=0;i<firstDay;i++) cells.push({date:prevLast-firstDay+1+i, cur:false});
    for(let i=1;i<=lastDate;i++) cells.push({date:i, cur:true});
    const rem = (7 - cells.length%7) % 7;
    for(let i=1;i<=rem;i++) cells.push({date:i, cur:false});

    cells.forEach(c => {
      const d = c.cur ? `${month}-${String(c.date).padStart(2,'0')}` : '';
      const isToday = d === TODAY;
      const isSel = d === this.calSelected && d;
      const scheds = d ? (schedByDate[d]||[]) : [];
      html += `<div class="cal-day ${isToday?'today':''} ${isSel&&!isToday?'selected':''} ${!c.cur?'other-month':''}" onclick="${d?`App.selectCalDay('${d}')`:''}" >
        <div class="num">${c.date}</div>
        ${scheds.length ? `<div class="dots">${scheds.slice(0,3).map(s=>`<div class="dot ${s.status==='completed'?'done':''}"></div>`).join('')}</div>` : ''}
      </div>`;
    });

    html += `</div></div>`;

    const sel = this.calSelected;
    const dayScheds = schedByDate[sel] || [];
    html += `<div class="section-label">${fmtDate(sel)} 일정</div>`;
    if(!dayScheds.length) {
      html += `<div style="padding:16px;text-align:center;color:var(--sub);font-size:14px">이 날 일정이 없습니다</div>`;
    } else {
      html += `<div class="schedule-list">`;
      dayScheds.forEach(s => {
        const sPhotos = (this.schedulePhotos || {})[s.id] || [];
        html += `<div style="background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)">
          <div class="sched-item" style="border-bottom:${sPhotos.length?'1px solid var(--border)':'none'}">
            <div class="sched-dot ${s.status==='completed'?'done':''}"></div>
            <div class="sched-info">
              <div class="title">${esc(s.title)}</div>
              <div class="site">${s.scheduled_time?`🕐 ${s.scheduled_time} · `:''}${s.site_name?`📍 ${esc(s.site_name)}`:'현장 미지정'}</div>
              ${s.memo?`<div class="site">${esc(s.memo)}</div>`:''}
            </div>
            <div class="sched-actions" style="flex-direction:column;gap:4px">
              ${s.status!=='completed'
                ? `<button class="btn btn-sm badge-green" onclick="App.completeSchedule('${s.id}')">완료</button>`
                : `<button class="btn btn-sm badge-orange" onclick="App.uncompleteSchedule('${s.id}')">↩ 복구</button>`}
              <button class="btn btn-sm btn-outline" onclick="App.editSchedule('${s.id}')">편집</button>
              <button class="btn btn-sm" style="background:#ffe3e3;color:#c0001a" onclick="App.deleteSchedule('${s.id}')">삭제</button>
            </div>
          </div>
          ${sPhotos.length ? `
          <div style="display:grid;grid-template-columns:repeat(${Math.min(sPhotos.length,3)},1fr);gap:2px;padding:2px">
            ${sPhotos.map(p=>`
              <div style="position:relative;aspect-ratio:4/3;overflow:hidden">
                <img src="/api/thumb/${s.id}/${p.filename}" loading="lazy"
                  onclick="App.openLightbox('/api/photo/${s.id}/${p.filename}')"
                  style="width:100%;height:100%;object-fit:cover;cursor:pointer">
                <button class="del-btn" onclick="App.deleteSchedPhoto('${p.id}','${s.id}')">×</button>
              </div>`).join('')}
          </div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }

    document.getElementById('schedule-content').innerHTML = html;
  },

  selectCalDay(d) { this.calSelected = d; this.renderCalendar(); },
  calPrev() {
    this.calMonth--;
    if(this.calMonth<0){this.calMonth=11;this.calYear--;}
    this.renderSchedule();
  },
  calNext() {
    this.calMonth++;
    if(this.calMonth>11){this.calMonth=0;this.calYear++;}
    this.renderSchedule();
  },

  async completeSchedule(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(!s) return;
    try {
      const res = await API.post('/schedules/'+id+'/complete', {});
      if(res._queued) {
        this.toast('📵 오프라인 저장됨 — 온라인 복귀 시 자동 동기화');
        return;
      }
      if(res.visit && s.site_name) {
        this.toast('✅ 완료 — 방문기록이 자동으로 추가됐습니다');
      } else {
        this.toast('✅ 완료 처리됐습니다');
      }
      if(this.currentPage==='schedule') this.renderSchedule();
      else this.renderHome();
    } catch(e) { this.toast('저장 실패: ' + (e.message||'오류'), 'warn'); }
  },

  async uncompleteSchedule(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(!s) return;
    try {
      await API.put('/schedules/'+id, {...s, status:'pending'});
      this.toast('↩ 완료가 취소됐습니다');
      if(this.currentPage==='schedule') this.renderSchedule();
      else this.renderHome();
    } catch(e) { this.toast('저장 실패: ' + (e.message||'오류'), 'warn'); }
  },

  async deleteSchedule(id) {
    if(!confirm('일정을 삭제할까요?')) return;
    try {
      await API.del('/schedules/'+id);
      this.toast('삭제됐습니다');
      if(this.currentPage==='schedule') this.renderSchedule();
      else this.renderHome();
    } catch(e) { this.toast('삭제 실패: ' + (e.message||'오류'), 'warn'); }
  },

  // ── SEARCH ────────────────────────────────────────────────────────────
  async globalSearch(q) {
    clearTimeout(this._searchTimer);
    const el = document.getElementById('search-results');
    if(!q.trim()) { el.innerHTML=''; return; }
    this._searchTimer = setTimeout(async () => {
      try {
        const data = await API.get('/search?q=' + encodeURIComponent(q));
        let html = '';
        if(data.sites.length) {
          html += `<div class="section-label">현장 (${data.sites.length})</div><div class="card">`;
          data.sites.forEach(s => {
            html += `<div class="card-row" onclick="App.navigate('detail','${s.id}')">
              <div class="icon" style="background:#e8f5e9">🏭</div>
              <div class="info"><div class="title">${esc(s.name)}</div><div class="sub">${esc(s.address||'-')}</div></div>
              <span class="chevron">›</span>
            </div>`;
          });
          html += `</div>`;
        }
        if(data.visits.length) {
          html += `<div class="section-label">방문 기록 (${data.visits.length})</div><div class="card">`;
          data.visits.forEach(v => {
            html += `<div class="card-row" onclick="App.navigate('detail','${v.site_id}')">
              <div class="icon" style="background:#e3f0ff">🔧</div>
              <div class="info">
                <div class="title">${esc(v.site_name||'현장없음')}</div>
                <div class="sub">${fmtDate(v.visit_date)} · ${esc(v.work_content||'-')}</div>
              </div>
              <span class="chevron">›</span>
            </div>`;
          });
          html += `</div>`;
        }
        if(!data.sites.length && !data.visits.length) {
          html = `<div class="empty"><div class="icon">🔍</div><p>"${esc(q)}" 검색 결과가 없습니다</p></div>`;
        }
        el.innerHTML = html;
      } catch(e) {
        el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>검색 중 오류가 발생했습니다</p></div>`;
      }
    }, 400);
  },

  async saveVisit() {
    const id = document.getElementById('visit-id').value;
    const siteId = document.getElementById('visit-site-id').value;
    const date = document.getElementById('visit-date').value;
    if(!date) { alert('날짜를 입력하세요'); return; }
    const data = {
      visit_date: date,
      work_content: document.getElementById('visit-work').value,
      engineer: document.getElementById('visit-engineer').value,
      status: document.getElementById('visit-status').value,
      memo: document.getElementById('visit-memo').value
    };
    try {
      let visit;
      if(id) { const r = await API.put('/visits/'+id, data); visit = r._queued ? {id, _queued:true} : {id}; }
      else { visit = await API.post('/sites/'+siteId+'/visits', data); }

      if(visit._queued) {
        this.toast('📵 오프라인 저장됨 — 온라인 복귀 시 자동 동기화');
        this._visitPendingPhotos = [];
        this.closeModal('modal-visit');
        return;
      }

      // 사진 업로드
      const files = this._visitPendingPhotos || [];
      if(files.length) {
        this.toast('사진 저장 중...');
        for(const file of files) {
          const fd = new FormData();
          fd.append('photo', file);
          fd.append('visit_id', visit.id);
          await API.upload('/sites/'+siteId+'/photos', fd).catch(()=>{});
        }
      }

      this.toast(id ? '방문 기록이 수정됐습니다' : '방문 기록이 추가됐습니다');
      this._visitPendingPhotos = [];
      this.closeModal('modal-visit');
      this.currentTab = 'visits';
      this.renderDetail(siteId);
    } catch(e) { this.toast('저장 실패: ' + (e.message||'오류'), 'warn'); }

  async saveSchedule() {
    const id = document.getElementById('sched-id').value;
    const title = document.getElementById('sched-title').value.trim();
    const date = document.getElementById('sched-date').value;
    const tbd = document.getElementById('sched-tbd').checked;
    if(!title) { alert('제목을 입력하세요'); return; }
    if(!tbd && !date) { alert('날짜를 입력하거나 "날짜 미정"을 체크하세요'); return; }
    // 편집 시 원래 status 유지 (완료된 일정이 'pending'으로 리셋되는 버그 방지)
    const origStatus = id ? ((this.schedules.find(s=>s.id===id)||{}).status || 'pending') : 'pending';
    const data = {
      title, scheduled_date: tbd ? null : date,
      site_id: document.getElementById('sched-site').value || null,
      scheduled_time: document.getElementById('sched-time').value || null,
      memo: document.getElementById('sched-memo').value,
      status: origStatus
    };
    try {
      let sched;
      if(id) { const r = await API.put('/schedules/'+id, data); sched = r._queued ? {id, _queued:true} : {id}; }
      else { sched = await API.post('/schedules', data); }

      if(sched._queued) {
        this.toast('📵 오프라인 저장됨 — 온라인 복귀 시 자동 동기화');
        this._schedPendingPhotos = [];
        this.closeModal('modal-schedule');
        return;
      }

      const files = this._schedPendingPhotos || [];
      if(files.length) {
        this.toast('사진 저장 중...');
        for(const file of files) {
          const fd = new FormData();
          fd.append('photo', file);
          await API.upload('/schedules/'+sched.id+'/photos', fd).catch(()=>{});
        }
      }

      this.toast(id ? '일정이 수정됐습니다' : '일정이 추가됐습니다');
      this._schedPendingPhotos = [];
      this.closeModal('modal-schedule');
      // 메모 → 일정 전환 시 원본 메모 삭제 여부
      if(!id && this._pendingDeleteMemoId) {
        const memoId = this._pendingDeleteMemoId;
        this._pendingDeleteMemoId = null;
        if(confirm('원본 메모도 삭제할까요?')) {
          await API.del('/memos/'+memoId).catch(()=>{});
        }
      }
      if(this.currentPage==='schedule') {
        this.calSelected = date;
        this.calYear = parseInt(date.slice(0,4));
        this.calMonth = parseInt(date.slice(5,7))-1;
        this.renderSchedule();
      } else this.renderHome();
    } catch(e) { this.toast('저장 실패: ' + (e.message||'오류'), 'warn'); }
  },

  async deletePhoto(pid) {
    if(!confirm('사진을 삭제할까요?')) return;
    try {
      await API.del('/photos/'+pid);
      this.toast('삭제됐습니다');
      if(this.currentSite) this.renderDetail(this.currentSite.id);
      else this.renderSchedule();
    } catch(e) { this.toast('삭제 실패','warn'); }
  },

  async deleteSchedPhoto(pid, schedId) {
    if(!confirm('사진을 삭제할까요?')) return;
    try {
      await API.del('/photos/'+pid);
      if(this.schedulePhotos && this.schedulePhotos[schedId]) {
        this.schedulePhotos[schedId] = this.schedulePhotos[schedId].filter(p=>p.id!==pid);
      }
      this.toast('삭제됐습니다');
      this.renderCalendar();
    } catch(e) { this.toast('삭제 실패','warn'); }
  },

  // ── MEMO ──────────────────────────────────────────────────────────────
  async renderMemo() {
    const el = document.getElementById('memo-list');
    try {
      const memos = await API.get('/memos');
      if(!memos.length) {
        el.innerHTML = `<div class="empty"><div class="icon">📝</div><p>메모가 없습니다<br>오른쪽 상단 + 버튼으로 메모를 추가하세요</p></div>`;
        return;
      }
      el.innerHTML = memos.map(m => `
        <div class="memo-card" onclick="App.editMemo('${m.id}')">
          <div class="memo-title">${esc(m.title)}</div>
          ${m.content ? `<div class="memo-body">${esc(m.content)}</div>` : ''}
          <div class="memo-date">${fmtDatetime(m.updated_at)}</div>
          <div class="memo-actions" onclick="event.stopPropagation()">
            <button class="btn btn-sm badge-blue" onclick="App.memoToSchedule('${m.id}')">📅 일정으로</button>
            <button class="btn btn-sm btn-outline" onclick="App.editMemo('${m.id}')">편집</button>
            <button class="btn btn-sm" style="background:#ffe3e3;color:#c0001a" onclick="App.deleteMemo('${m.id}')">삭제</button>
          </div>
        </div>`).join('');
    } catch(e) {
      el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>메모를 불러올 수 없습니다</p></div>`;
    }
  },

  showAddMemo() {
    document.getElementById('modal-memo-title').textContent = '메모 추가';
    document.getElementById('memo-id').value = '';
    document.getElementById('memo-title').value = '';
    document.getElementById('memo-content').value = '';
    this.openModal('modal-memo');
    setTimeout(() => document.getElementById('memo-title').focus(), 100);
  },

  async editMemo(id) {
    try {
      const memos = await API.get('/memos');
      const m = memos.find(x => x.id === id);
      if(!m) return;
      document.getElementById('modal-memo-title').textContent = '메모 편집';
      document.getElementById('memo-id').value = m.id;
      document.getElementById('memo-title').value = m.title;
      document.getElementById('memo-content').value = m.content || '';
      this.openModal('modal-memo');
    } catch(e) { this.toast('불러오기 실패', 'warn'); }
  },

  async saveMemo() {
    const id = document.getElementById('memo-id').value;
    const title = document.getElementById('memo-title').value.trim();
    if(!title) { alert('제목을 입력하세요'); return; }
    const data = { title, content: document.getElementById('memo-content').value };
    try {
      if(id) await API.put('/memos/'+id, data);
      else await API.post('/memos', data);
      this.toast(id ? '메모가 수정됐습니다' : '메모가 저장됐습니다');
      this.closeModal('modal-memo');
      this.renderMemo();
    } catch(e) { this.toast('저장 실패: '+(e.message||'오류'), 'warn'); }
  },

  async deleteMemo(id) {
    if(!confirm('메모를 삭제할까요?')) return;
    try {
      await API.del('/memos/'+id);
      this.toast('삭제됐습니다');
      this.renderMemo();
    } catch(e) { this.toast('삭제 실패', 'warn'); }
  },

  async memoToSchedule(id) {
    // 메모 내용을 일정 모달로 전환
    const memos = await API.get('/memos').catch(()=>[]);
    const m = memos.find(x => x.id === id);
    if(!m) return;
    const sites = this.sites.length ? this.sites : await API.get('/sites').catch(()=>[]);
    this.sites = sites;
    document.getElementById('modal-sched-title').textContent = '일정으로 등록';
    document.getElementById('sched-id').value = '';
    document.getElementById('sched-title').value = m.title;
    document.getElementById('sched-date').value = TODAY;
    document.getElementById('sched-time').value = '';
    document.getElementById('sched-memo').value = m.content || '';
    document.getElementById('sched-tbd').checked = false;
    document.getElementById('sched-date-row').style.display = 'grid';
    this._setSiteSearch('');
    this._resetSchedModal();
    this.closeModal('modal-memo');
    this.openModal('modal-schedule');
    // 일정 저장 후 원본 메모 삭제 여부 묻기
    this._pendingDeleteMemoId = id;
  },

  toast(msg, type='ok') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if(type==='warn') el.style.background='rgba(200,80,0,.92)';
    else el.style.background='rgba(30,30,30,.92)';
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
  }
};

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) {
  if(!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
function fmtDatetime(d) {
  if(!d) return '-';
  const dt = new Date(d.replace(' ', 'T'));
  const pad = n => String(n).padStart(2,'0');
  return `${dt.getFullYear()}.${pad(dt.getMonth()+1)}.${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
}

// ── Schedule modal photo preview ───────────────────────────────────────────
document.getElementById('schedPhotoInput').addEventListener('change', function() {
  const files = Array.from(this.files);
  if(!files.length) return;
  App._schedPendingPhotos = (App._schedPendingPhotos || []).concat(files);
  const preview = document.getElementById('sched-photo-preview');
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.style.cssText = 'position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden';
    div.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
    preview.appendChild(div);
  });
  this.value = '';
});

// ── Visit modal photo preview ──────────────────────────────────────────────
document.getElementById('visitPhotoInput').addEventListener('change', function() {
  const files = Array.from(this.files);
  if(!files.length) return;
  App._visitPendingPhotos = (App._visitPendingPhotos || []).concat(files);
  const preview = document.getElementById('visit-photo-preview');
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.style.cssText = 'position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden';
    div.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
    preview.appendChild(div);
  });
  this.value = '';
});

// ── Photo upload ───────────────────────────────────────────────────────────
document.getElementById('photoInput').addEventListener('change', async function() {
  if(!App.currentSite || !this.files.length) return;
  const files = Array.from(this.files);
  const visitId = App._uploadVisitId || null;
  App._uploadVisitId = null;
  App.toast('사진 업로드 중...');
  let ok = 0;
  for(const file of files) {
    const fd = new FormData();
    fd.append('photo', file);
    if(visitId) fd.append('visit_id', visitId);
    try {
      await API.upload('/sites/'+App.currentSite.id+'/photos', fd);
      ok++;
    } catch(e) { App.toast('사진 업로드 실패: ' + (e.message||'오류'), 'warn'); }
  }
  if(ok) {
    App.toast(`사진 ${ok}장 저장됐습니다`);
    App.currentTab = 'visits';
    App.renderDetail(App.currentSite.id);
  }
  this.value = '';
});

// ── Modal close on backdrop click ─────────────────────────────────────────
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); });
});

// ── Service Worker ─────────────────────────────────────────────────────────
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ── 온라인 복귀 시 자동 동기화 ─────────────────────────────────────────────
window.addEventListener('online', () => {
  App.setOffline(false);
  if(Queue.count()) App.syncQueue();
});
window.addEventListener('offline', () => App.setOffline(true));

// ── Init ──────────────────────────────────────────────────────────────────
App.renderHome();
// 앱 시작 시 미동기화 항목 처리
if(Queue.count()) setTimeout(() => App.syncQueue(), 2000);
</script>
